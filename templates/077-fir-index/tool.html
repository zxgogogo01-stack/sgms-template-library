<!DOCTYPE html>
<html lang='~LANG~'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#f7f6f2'>
    <title>保本量计算器 — ~SITE_NAME~</title>
    <meta name='description' content='算出需要多少月交易量，返佣才能覆盖固定成本。'>
    <link rel='canonical' href='https://~SITE_DOMAIN~/tool.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='~SITE_NAME~'>
    <meta property='og:title' content='保本量计算器 — ~SITE_NAME~'>
    <meta property='og:description' content='算出需要多少月交易量，返佣才能覆盖固定成本。'>
    <meta property='og:url' content='https://~SITE_DOMAIN~/tool.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='style.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "保本量计算器",
        "url": "https://~SITE_DOMAIN~/tool.html"
    }
    </script>
    <style>
        /* 工具页补充样式 */
        .evenpoint { max-width: 540px; margin: 0 auto; padding: 50px 24px 82px; }
        .evenpoint-card {
            background: var(--leafcard);
            border-radius: calc(var(--edge77) + 4px);
            box-shadow: var(--shade77-hi);
            border-top: 4px solid var(--firgreen);
            padding: 42px 46px;
        }
        .evenpoint-card h1 { font-family: var(--serif77); font-size: 1.5rem; }
        .evenpoint-card > p { color: var(--stonegrey); margin: 6px 0 8px; }
        .evenpoint-card label {
            display: block;
            margin: 16px 0 6px;
            font-size: .86rem;
            font-weight: 800;
            color: var(--firgreen-deep);
        }
        .evenpoint-card input {
            width: 100%;
            min-height: 48px;
            padding: 10px 16px;
            border: 1.5px solid var(--twineline);
            border-radius: var(--edge77);
            background: var(--sandbed);
            color: var(--pineink);
            font: inherit;
            font-family: var(--mono77);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--slip77), box-shadow var(--slip77);
        }
        .evenpoint-card input:focus {
            outline: none;
            border-color: var(--firgreen);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--firgreen) 15%, transparent);
        }
        .evenpoint-card input[aria-invalid='true'] {
            border-color: #b42318;
            box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 14%, transparent);
        }
        .evenpoint-run {
            margin-top: 26px;
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: var(--edge77);
            background: var(--firgreen);
            color: #f2f7f0;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .06em;
            cursor: pointer;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--firgreen) 34%, transparent);
            transition: transform var(--slip77), background var(--slip77);
        }
        .evenpoint-run:hover { transform: translateY(-2px); background: var(--firgreen-deep); }
        .evenpoint-out {
            display: block;
            margin-top: 18px;
            min-height: 26px;
            padding: 15px 19px;
            border-radius: var(--edge77);
            background: var(--sandwash);
            line-height: 1.78;
            font-variant-numeric: tabular-nums;
        }
        .evenpoint-out b { color: var(--firgreen-deep); }
        @media (max-width: 600px) {
            .evenpoint-card { padding: 30px 22px; }
        }
    </style>
</head>
<body>
    <header class='lintel'>
        <div class='lintel-in'>
            <a class='lintel-brand' href='index.html'>~BRAND_EN~</a>
            <button type='button' class='lintel-btn' id='lintel-btn' aria-label='主导航' aria-expanded='false' aria-controls='lintel-nav'>
                <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
            </button>
            <nav class='lintel-nav' id='lintel-nav' aria-label='主导航'>
                <a href='index.html'>索引</a>
                <a href='article.html'>文章</a>
                <a href='tool.html' aria-current='page'>保本量</a>
                <a href='legal.html'>披露</a>
            </nav>
        </div>
    </header>

    <main class='evenpoint'>
        <form class='evenpoint-card' id='be-form' novalidate>
            <h1>保本量计算器</h1>
            <p>比如每月订阅工具花 30 块：要做多少交易量，返佣才能把它挣回来？本地计算。</p>
            <label for='be-cost'>月固定成本</label>
            <input type='number' id='be-cost' step='any' min='0' placeholder='如 30' aria-describedby='be-out'>
            <label for='be-rate'>手续费率（%）</label>
            <input type='number' id='be-rate' step='any' min='0' max='100' placeholder='如 0.05' aria-describedby='be-out'>
            <label for='be-cut'>返佣比例（%）</label>
            <input type='number' id='be-cut' step='any' min='0' max='100' placeholder='如 30' aria-describedby='be-out'>
            <button type='submit' class='evenpoint-run' id='be-run'>算保本量</button>
            <output class='evenpoint-out' id='be-out' role='status' aria-live='polite'></output>
        </form>
    </main>

    <footer class='groundline'>
        <div class='groundline-in'>
            <p class='groundline-fine'>结果仅供参考，实际以平台结算为准。</p>
        </div>
    </footer>

    <script src='roster.js'></script>
</body>
</html>
