<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>费用估算器 — {{SITE_NAME}}</title>
  <meta name="description" content="按金额与费率估算交易费用的小工具。">
  <link rel="canonical" href="https://{{SITE_DOMAIN}}/tool.html">
  <meta property="og:title" content="费用估算器 — {{SITE_NAME}}">
  <meta property="og:description" content="按金额与费率估算交易费用的小工具。">
  <meta property="og:url" content="https://{{SITE_DOMAIN}}/tool.html">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/layout.css">
  <link rel="stylesheet" href="assets/parts.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "费用估算器",
    "url": "https://{{SITE_DOMAIN}}/tool.html"
  }
  </script>
  <style>
    .calc-box {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 6px;
      padding: 32px;
    }
    .calc-box__row {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }
    .calc-box__row input {
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid #b9c6d0;
      border-radius: 4px;
      font: inherit;
      background: #fff;
      color: #22303c;
    }
    .calc-box__go {
      min-height: 44px;
      padding: 8px 32px;
      border: 0;
      border-radius: 4px;
      background: #1b5e8a;
      color: #fff;
      cursor: pointer;
    }
    .calc-box__out {
      margin-top: 24px;
      padding: 16px;
      background: #eef2f5;
      border-radius: 4px;
      min-height: 24px;
    }
    @media (prefers-color-scheme: dark) {
      .calc-box { background: #1e262d; }
      .calc-box__out { background: #232d35; }
      .calc-box__row input {
        background: #161c21;
        color: #d5dde3;
        border-color: #3a4a57;
      }
    }
  </style>
</head>
<body>
  <header class="top-line">
    <a class="top-line__brand" href="index.html" aria-label="返回首页">{{SITE_NAME}}</a>
    <nav class="top-line__nav" aria-label="主导航">
      <a class="top-line__link" href="index.html">费率总览</a>
      <a class="top-line__link" href="article.html">文章</a>
      <a class="top-line__link" href="tool.html" aria-current="page">工具</a>
      <a class="top-line__link" href="legal.html">关于</a>
    </nav>
  </header>

  <main class="page-well">
    <section class="intro">
      <h1 class="intro__title">费用估算器</h1>
      <p class="intro__sub">输入金额与费率，得到预估费用。结果仅供参考。</p>
    </section>

    <form class="calc-box" id="fee-calc" novalidate>
      <div class="calc-box__row">
        <label for="calc-amount">金额</label>
        <input type="number" id="calc-amount" step="any" min="0" inputmode="decimal" placeholder="如 1000" aria-describedby="calc-result" required>
      </div>
      <div class="calc-box__row">
        <label for="calc-rate">费率（%）</label>
        <input type="number" id="calc-rate" step="any" min="0" inputmode="decimal" placeholder="如 0.05" aria-describedby="calc-result" required>
      </div>
      <button class="calc-box__go" type="submit">计算</button>
      <p class="calc-box__out" id="calc-result" role="status" aria-live="polite" aria-atomic="true">输入金额与费率后开始计算。</p>
    </form>
  </main>

  <footer class="site-foot">
    <p class="site-foot__line">本站内容仅作信息整理，不构成任何投资建议。联系：{{CONTACT_EMAIL}}</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
