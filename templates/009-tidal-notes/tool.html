    "@context": "https://schema.org",

    "name": "日期差计算",

<body>
  <header class="strand">
    <a class="strand__title" href="index.html" aria-label="返回 {{SITE_NAME}} 首页">{{SITE_NAME}}</a>
    <nav class="strand__paths" aria-label="主导航">
      <a class="strand__path" href="index.html">时间线</a>

    <section class="gap-shell" aria-labelledby="gap-title">

        <p class="page-kicker">FIELD TOOL / DATE GAP</p>

        <output id="gap-out" aria-live="polite">选择两个日期后，结果会显示在这里。</output>
      </div>
    </section>
