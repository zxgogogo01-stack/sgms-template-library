<!DOCTYPE html>
<html lang='%%LANG%%'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#f4f2f0'>
    <title>披露与免责 — %%SITE_NAME%%</title>
    <meta name='description' content='%%SITE_NAME%% 的利益披露与免责声明。'>
    <link rel='canonical' href='https://%%SITE_DOMAIN%%/legal.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='%%SITE_NAME%%'>
    <meta property='og:title' content='披露与免责 — %%SITE_NAME%%'>
    <meta property='og:description' content='%%SITE_NAME%% 的利益披露与免责声明。'>
    <meta property='og:url' content='https://%%SITE_DOMAIN%%/legal.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='assets/mail.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "披露与免责",
        "url": "https://%%SITE_DOMAIN%%/legal.html"
    }
    </script>
    <style>
        .filedmail { max-width: 680px; margin: 0 auto; padding: 44px 24px 80px; }
        .filedmail h1 { font-family: var(--serif71); font-size: 1.75rem; }
        .filedmail-meta { margin: 8px 0 24px; font-size: .84rem; color: var(--dovegrey); font-variant-numeric: tabular-nums; }
        .envelope {
            background: var(--panewhite);
            border: 1px solid var(--sealine);
            border-radius: var(--slotR);
            box-shadow: var(--lift71);
            padding: 22px 28px;
            margin-bottom: 13px;
            position: relative;
            overflow: hidden;
        }
        .envelope::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, var(--plum71), transparent 65%);
        }
        .envelope h2 { font-family: var(--serif71); font-size: 1.04rem; margin-bottom: 7px; color: var(--plum71-deep); }
        .envelope p { margin: 0; color: var(--dovegrey); }
    </style>
</head>
<body>
    <header class='postbar'>
        <div class='postbar-in'>
            <a class='postbar-brand' href='index.html'>%%BRAND_EN%%</a>
            <button type='button' class='postbar-btn' id='postbar-btn' aria-label='主导航' aria-expanded='false' aria-controls='postbar-nav'>
                <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
            </button>
            <nav class='postbar-nav' id='postbar-nav' aria-label='主导航'>
                <a href='index.html'>收件箱</a>
                <a href='article.html'>信件</a>
                <a href='tool.html'>对账核对</a>
                <a href='legal.html' aria-current='page'>披露</a>
            </nav>
        </div>
    </header>

    <main class='filedmail'>
        <h1>披露与免责</h1>
        <p class='filedmail-meta'>更新 2026-01-19</p>

        <section class='envelope'>
            <h2>利益披露</h2>
            <p>本站（%%SITE_DOMAIN%%）展示交易平台邀请码。用码注册不会多付费用，还能享最高 20% 手续费减免*（* 实际比例以交易所页面显示为准，可能随政策调整）。</p>
        </section>

        <section class='envelope'>
            <h2>内容口径</h2>
            <p>每封信为公开信息整理，注明核对时间；平台规则随时调整，以官方页面实时显示为准。</p>
        </section>

        <section class='envelope'>
            <h2>免责声明</h2>
            <p>内容不构成投资建议；数字资产波动剧烈，请自行评估风险。</p>
        </section>

        <section class='envelope'>
            <h2>更正与联系</h2>
            <p>纠错请附条目与依据：%%CONTACT_EMAIL%%。查实即更正并注明时间。</p>
        </section>
    </main>

    <footer class='postfoot'>
        <div class='postfoot-in'>
            <p class='postfoot-fine'>内容以各平台官方页面为准；不构成投资建议。</p>
        </div>
    </footer>

    <script src='assets/mail.js'></script>
</body>
</html>
