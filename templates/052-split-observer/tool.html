<!DOCTYPE html>
<html lang='~LANG~'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='theme-color' content='#7c1f2e'>
  <title>返佣试算 — ~SITE_NAME~</title>
  <meta name='description' content='按成交额、费率与分成比例粗算月返佣。'>
  <link rel='canonical' href='https://~SITE_DOMAIN~/tool.html'>
  <meta property='og:type' content='website'>
  <meta property='og:site_name' content='~SITE_NAME~'>
  <meta property='og:title' content='返佣试算 — ~SITE_NAME~'>
  <meta property='og:description' content='按成交额、费率与分成比例粗算月返佣。'>
  <meta property='og:url' content='https://~SITE_DOMAIN~/tool.html'>
  <meta name='twitter:card' content='summary'>
  <link rel='stylesheet' href='style.css'>
  <script type='application/ld+json'>
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "返佣试算",
    "url": "https://~SITE_DOMAIN~/tool.html"
  }
  </script>
  <style>
    .bench {
      max-width: 600px;
      margin: 0 auto;
      padding: 46px 24px 80px;
    }
    .bench-card {
      background: var(--sheet);
      border: 2px solid var(--coal);
      border-radius: var(--bend);
      box-shadow: 6px 6px 0 var(--gilt);
      padding: 40px 44px;
    }
    .bench-card h1 { font-size: 1.55rem; margin-bottom: 8px; }
    .bench-card > p { color: var(--quiet); margin: 0 0 16px; }
    .bench-card label {
      display: block;
      margin: 16px 0 6px;
      font-size: .88rem;
      font-weight: 700;
      color: var(--coal2);
    }
    .bench-card input {
      width: 100%;
      min-height: 47px;
      padding: 10px 15px;
      border: 2px solid var(--rule);
      border-radius: var(--bend);
      background: var(--cream);
      color: var(--coal);
      font: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color var(--tick);
    }
    .bench-card input:focus { outline: none; border-color: var(--wine); }
    .bench-card input[aria-invalid='true'] { border-color: var(--wine2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wine2) 20%, transparent); }
    .bench-run {
      margin-top: 24px;
      width: 100%;
      min-height: 50px;
      border: 2px solid var(--coal);
      border-radius: var(--bend);
      background: var(--wine);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      transition: background var(--tick), transform var(--tick);
    }
    .bench-run:hover { background: var(--wine2); transform: translateY(-2px); }
    .bench-run:active { transform: translateY(0); }
    .bench-out {
      display: block;
      margin-top: 18px;
      min-height: 24px;
      padding: 14px 18px;
      border-left: 4px solid var(--gilt);
      background: var(--wash);
      color: var(--coal2);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 620px) {
      .bench-card { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <header class='mast'>
    <div class='mast-in'>
      <a class='sig' href='index.html'>~BRAND_EN~</a>
      <button type='button' class='mast-btn' id='mast-btn' aria-label='主导航' aria-expanded='false' aria-controls='mast-nav'>
        <svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M3 6h18M3 12h18M3 18h18'/></svg>
      </button>
      <nav class='mast-nav' id='mast-nav' aria-label='主导航'>
        <a href='index.html'>观察</a>
        <a href='article.html'>评述</a>
        <a href='tool.html' aria-current='page'>算一算</a>
        <a href='legal.html'>披露</a>
      </nav>
    </div>
  </header>

  <main class='bench'>
    <form class='bench-card' id='rb-form' novalidate>
      <h1>返佣试算</h1>
      <p>三个数粗算月返佣，全部在浏览器本地计算。结果是演示口径，不构成收益承诺。</p>
      <label for='rb-vol'>月成交额（估）</label>
      <input type='number' id='rb-vol' step='any' min='0' placeholder='如 200000' aria-describedby='rb-out'>
      <label for='rb-fee'>手续费率（%）</label>
      <input type='number' id='rb-fee' step='any' min='0' max='100' placeholder='如 0.08' aria-describedby='rb-out'>
      <label for='rb-cut'>返佣分成比例（%）</label>
      <input type='number' id='rb-cut' step='any' min='0' max='100' placeholder='如 30' aria-describedby='rb-out'>
      <button type='submit' class='bench-run' id='rb-run'>试算</button>
      <output class='bench-out' id='rb-out' role='status' aria-live='polite'></output>
    </form>
  </main>

  <footer class='foot'>
    <p class='foot-line'>结果仅供参考，实际以各平台结算记录为准。</p>
  </footer>

  <script src='boot.js'></script>
</body>
</html>
