<!DOCTYPE html>
<html lang='~LANG~'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>页码缺席 — ~SITE_NAME~</title>
  <meta name='robots' content='noindex'>
  <link rel='stylesheet' href='style.css'>
  <style>
    .absent {
      max-width: 460px;
      margin: 15vh auto;
      padding: 50px 40px;
      text-align: center;
      background: var(--sheet);
      border: 2px solid var(--coal);
      border-radius: var(--bend);
      box-shadow: 8px 8px 0 var(--gilt);
    }
    .absent h1 {
      font-family: var(--face-num);
      font-style: italic;
      font-size: 3.4rem;
      color: var(--wine);
    }
    .absent p { color: var(--quiet); }
    .absent .press-full { margin-top: 8px; }
  </style>
</head>
<body>
  <div class='absent'>
    <h1>404</h1>
    <p>这一页缺席了——不存在或已移动。</p>
    <p><a class='press press-full' href='index.html'>回观察台</a></p>
  </div>
</body>
</html>
