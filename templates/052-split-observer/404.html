<!DOCTYPE html>

  <link rel='stylesheet' href='style.css'>
  <style>
    .absent-well {
      min-height: calc(100vh - 226px);
      display: grid;
      place-items: center;
      padding: clamp(46px, 9vh, 96px) 24px;
    }
    .absent {
      width: min(100%, 460px);
      max-width: 460px;
      padding: 50px 40px;
      text-align: center;
      background: var(--sheet);
      border: 2px solid var(--coal);
      border-radius: var(--bend);
      box-shadow: 8px 8px 0 var(--gilt);
    }
    .absent h1 {
      font-family: var(--face-num);
      font-style: italic;
      font-size: 3.4rem;
      color: var(--wine);
    }
    .absent p { color: var(--quiet); }
    .absent .press-full { margin-top: 8px; }
    @media (max-width: 620px) {
      .absent-well { min-height: calc(100vh - 266px); padding-inline: 18px; }
      .absent { padding: 42px 24px; }
    }
  </style>
</head>

      <p><a class='press press-full' href='index.html'>回观察台</a></p>
