<body>
  <a class="gl58-skip" href="#gl58-main">跳到主要内容</a>
  <header class="gl58-rail"><div class="gl58-brand"><a href="index.html"><b>G</b><span>__brand_en__</span></a><small>CHANGE DESK / 058</small></div><button class="gl58-nav-button" type="button" aria-expanded="false" aria-controls="gl58-nav"><span aria-hidden="true">＋</span><i class="gl58-sr">打开导航</i></button><nav class="gl58-nav" id="gl58-nav" aria-label="主导航"><a href="index.html"><em>01</em>记录线</a><a href="article.html"><em>02</em>拆解页</a><a aria-current="page" href="tool.html"><em>03</em>时区换算</a><a href="legal.html"><em>04</em>披露</a></nav><div class="gl58-rail-end"><button type="button" data-theme-toggle aria-label="切换深浅主题">DARK</button><p>一条变更<br>一套证据</p></div></header>
  <main class="gl58-converter" id="gl58-main">
    <header><p>TIME TRANSFER / UTC</p><h1>公告时区换算器</h1><span>保留原时区，再生成 UTC 与目标发布时间；全部在浏览器本地计算。</span></header>
    <div class="gl58-converter-grid">
      <form id="gl58-time-form" novalidate>
        <div class="gl58-field"><label for="gl58-date">公告日期</label><input id="gl58-date" type="text" inputmode="numeric" autocomplete="off" placeholder="2026-01-19" aria-describedby="gl58-time-help gl58-time-message"></div>
        <div class="gl58-field"><label for="gl58-time">公告时间</label><input id="gl58-time" type="text" inputmode="numeric" autocomplete="off" placeholder="23:30" aria-describedby="gl58-time-help gl58-time-message"></div>
        <div class="gl58-field"><label for="gl58-source-zone">来源时区</label><select id="gl58-source-zone" aria-describedby="gl58-time-help"><option value="-5">UTC−05:00</option><option value="0">UTC±00:00</option><option value="8" selected>UTC+08:00</option><option value="9">UTC+09:00</option></select></div>
        <div class="gl58-field"><label for="gl58-target-zone">目标时区</label><select id="gl58-target-zone" aria-describedby="gl58-time-help"><option value="-5">UTC−05:00</option><option value="0" selected>UTC±00:00</option><option value="8">UTC+08:00</option><option value="9">UTC+09:00</option></select></div>
        <p id="gl58-time-help">日期范围 2000-01-01 至 2099-12-31；时间使用 24 小时制。</p><p id="gl58-time-message" role="status" aria-live="polite">填写日期和时间后开始换算。</p>
        <div class="gl58-time-presets" aria-label="换算预设"><button type="button" data-time-preset="2026-01-19,23:30,8,0">东八区 → UTC</button><button type="button" data-time-preset="2026-01-19,00:15,0,8">UTC → 东八区</button><button type="button" data-time-preset="2024-02-29,23:45,-5,9">闰日跨日</button></div>
        <div class="gl58-time-actions"><button type="submit">画出时间线</button><button type="button" data-time-reset>清空</button></div>
      </form>
      <section class="gl58-time-output" aria-labelledby="gl58-time-result-title"><header><span>TRANSFER RESULT</span><b data-time-state>等待输入</b></header><ol><li><span>来源记录</span><time data-source-time>—</time></li><li><span>UTC 基准</span><time data-utc-time>—</time></li><li><span>目标发布</span><time data-target-time>—</time></li></ol><h2 id="gl58-time-result-title" data-day-shift>尚未生成日期关系</h2><p>结果用于转录公告时间；发布前仍需核对原文的时区标识与夏令时规则。</p><button type="button" data-copy-time disabled>复制换算结果</button><small data-time-copy-status role="status" aria-live="polite"></small></section>
    </div>
  </main>
  <script src="line.js"></script>
</body>
</html>
