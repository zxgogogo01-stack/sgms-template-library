<body>
  <a class="mc60-skip" href="#mc60-main">跳到主要内容</a><header class="mc60-top"><div><a class="mc60-brand" href="index.html"><span>{BRAND_EN}</span><small>CURATED NOTES / 060</small></a><button class="mc60-menu-button" type="button" aria-expanded="false" aria-controls="mc60-menu"><span aria-hidden="true">☰</span><i class="mc60-sr">打开导航</i></button><nav class="mc60-menu" id="mc60-menu" aria-label="主导航"><a href="index.html">策展墙</a><a href="article.html">研究札记</a><a aria-current="page" href="tool.html">来源整理</a><a href="legal.html">披露</a><button type="button" data-theme-toggle aria-label="切换深浅主题">夜间</button></nav></div></header>
  <main class="mc60-organizer" id="mc60-main"><header><p>SOURCE SORTER / URL</p><h1>来源链接整理板</h1><span>每行一条候选链接，先检查格式与重复，再进行人工来源核验。</span></header><div class="mc60-organizer-grid">
    <form id="mc60-url-form" novalidate><label for="mc60-urls">候选来源链接</label><textarea id="mc60-urls" rows="14" maxlength="9000" placeholder="每行输入一条完整 URL" aria-describedby="mc60-url-help mc60-url-message"></textarea><div class="mc60-url-meta"><small data-url-count>0 条</small><small id="mc60-url-help">最多 30 条非空行，只接受 HTTP/HTTPS。</small></div><p id="mc60-url-message" role="status" aria-live="polite">输入至少一条候选链接。</p><div class="mc60-url-presets" aria-label="整理预设"><button type="button" data-url-preset="mixed">混合样本</button><button type="button" data-url-preset="duplicates">重复链接</button><button type="button" data-url-preset="secure">多域名 HTTPS</button></div><div class="mc60-url-actions"><button type="submit">开始整理</button><button type="button" data-url-reset>清空</button></div></form>
    <section class="mc60-url-report" aria-labelledby="mc60-report-title"><header><span>SORTED BOARD</span><b data-url-state>等待输入</b></header><h2 id="mc60-report-title" data-url-verdict>尚未生成来源板</h2><dl><div><dt>有效</dt><dd data-valid-count>—</dd></div><div><dt>域名</dt><dd data-domain-count>—</dd></div><div><dt>重复</dt><dd data-duplicate-count>—</dd></div><div><dt>无效</dt><dd data-invalid-count>—</dd></div></dl><div class="mc60-url-lists"><section><h3>保留链接</h3><ol data-valid-list><li>等待整理</li></ol></section><section><h3>无效或不支持</h3><ul data-invalid-list><li>等待整理</li></ul></section></div><p>格式有效不代表内容可信、安全或长期存在；发布前必须人工访问并核对来源主体。</p><button type="button" data-copy-urls disabled>复制整理结果</button><small data-url-copy-status role="status" aria-live="polite"></small></section>
  </div></main>
  <script src="glue.js"></script>
</body>
</html>
