<!DOCTYPE html>
<html lang='[[LANG]]'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>无信号 — [[SITE_NAME]]</title>
  <meta name='robots' content='noindex'>
  <link rel='stylesheet' href='radio.css'>
  <style>
    /* 404 extras */
    .staticnoise { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
    .staticnoise-card {
      background: var(--walnut);
      border: 1px solid var(--grille);
      border-radius: calc(var(--dialR) + 4px);
      padding: 50px 40px;
    }
    .staticnoise-card h1 {
      font-family: var(--mono74);
      font-size: 3.1rem;
      letter-spacing: .12em;
      color: var(--amberdial);
      text-shadow: 0 0 26px color-mix(in srgb, var(--amberdial) 50%, transparent);
    }
    .staticnoise-card p { color: var(--khaki74); margin: 8px 0 22px; }
  </style>
</head>
<body>
  <div class='staticnoise'>
    <div class='staticnoise-card'>
      <h1>404</h1>
      <p>这个频率只有沙沙声——节目不存在或已停播。</p>
      <a class='fader fader-hot' href='index.html'>调回主频道</a>
    </div>
  </div>
</body>
</html>
