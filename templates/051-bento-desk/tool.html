<!DOCTYPE html>
<html lang="%%LANG%%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e2a52">
    <title>手续费对比器 — %%SITE_NAME%%</title>
    <meta name="description" content="同一笔成交额，两个平台各收多少手续费，差多少一眼看清。">
    <link rel="canonical" href="https://%%SITE_DOMAIN%%/tool.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="%%SITE_NAME%%">
    <meta property="og:title" content="手续费对比器 — %%SITE_NAME%%">
    <meta property="og:description" content="同一笔成交额，两个平台各收多少手续费，差多少一眼看清。">
    <meta property="og:url" content="https://%%SITE_DOMAIN%%/tool.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/page.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "手续费对比器",
        "url": "https://%%SITE_DOMAIN%%/tool.html"
    }
    </script>
</head>
<body>
    <a class="bd51-skip" href="#bd51-main">跳到主要内容</a>
    <header class="bd51-crown">
        <div class="bd51-crown-in">
            <a class="bd51-wordmark" href="index.html">%%BRAND_EN%%<span class="bd51-wordmark-dot">.</span></a>
            <button type="button" class="bd51-crown-fold" id="bd51-fold-btn" aria-label="主导航" aria-expanded="false" aria-controls="bd51-crown-nav">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <nav class="bd51-crown-nav" id="bd51-crown-nav" aria-label="主导航">
                <a href="index.html">首页</a>
                <a href="article.html">指南</a>
                <a href="tool.html" aria-current="page">工具</a>
                <a href="legal.html">披露</a>
                <button type="button" class="bd51-theme" id="bd51-theme-button" aria-label="切换到夜间模式">夜间</button>
            </nav>
        </div>
    </header>

    <main class="bd51-page-well" id="bd51-main">
        <nav class="bd51-crumb" aria-label="位置">
            <a href="index.html">首页</a><span aria-hidden="true">/</span><b>手续费对比器</b>
        </nav>

        <form class="bd51-rig-panel" id="bd51-cmp-form" novalidate>
            <h1>手续费对比器</h1>
            <p>输入同一笔成交额、两组手续费率与返佣分成，比较按分取整后的净手续费。数据只在当前页面计算。</p>
            <label for="bd51-cmp-vol">成交额</label>
            <input type="number" id="bd51-cmp-vol" name="volume" step="any" min="0.01" max="1000000000000" inputmode="decimal" required placeholder="如 50000" aria-describedby="bd51-cmp-help bd51-cmp-message">
            <small id="bd51-cmp-help">普通十进制，0.01–1,000,000,000,000，最多 2 位小数。</small>
            <div class="bd51-rig-platforms">
                <fieldset><legend>方案 A</legend><label for="bd51-cmp-a">手续费率（%）</label><input type="number" id="bd51-cmp-a" name="rate_a" step="any" min="0" max="100" inputmode="decimal" required placeholder="如 0.1" aria-describedby="bd51-cmp-message"><label for="bd51-share-a">返佣分成（%）</label><input type="number" id="bd51-share-a" name="share_a" step="any" min="0" max="100" inputmode="decimal" required value="0" aria-describedby="bd51-cmp-message"></fieldset>
                <fieldset><legend>方案 B</legend><label for="bd51-cmp-b">手续费率（%）</label><input type="number" id="bd51-cmp-b" name="rate_b" step="any" min="0" max="100" inputmode="decimal" required placeholder="如 0.08" aria-describedby="bd51-cmp-message"><label for="bd51-share-b">返佣分成（%）</label><input type="number" id="bd51-share-b" name="share_b" step="any" min="0" max="100" inputmode="decimal" required value="0" aria-describedby="bd51-cmp-message"></fieldset>
            </div>
            <div class="bd51-rig-presets"><button type="button" data-cmp-preset="100000,0.1,20,0.08,0">示例：净成本打平</button><button type="button" data-cmp-preset="250000,0.05,30,0.04,10">示例：返佣改变排序</button></div>
            <p class="bd51-rig-message" id="bd51-cmp-message" role="alert" aria-live="polite" aria-atomic="true"></p>
            <div class="bd51-rig-actions"><button type="submit" class="bd51-rig-run" id="bd51-cmp-run">生成对比</button><button type="button" class="bd51-rig-reset" data-cmp-reset>清空</button></div>
            <section class="bd51-rig-out" id="bd51-cmp-out" aria-live="polite" aria-atomic="true">
                <header><span data-cmp-state>等待输入</span><button type="button" data-copy-cmp disabled>复制结果</button></header>
                <output data-cmp-verdict>—</output>
                <dl><div><dt>A 手续费</dt><dd data-cmp-a-gross>—</dd></div><div><dt>A 返还</dt><dd data-cmp-a-rebate>—</dd></div><div><dt>A 净成本</dt><dd data-cmp-a-net>—</dd></div><div><dt>B 手续费</dt><dd data-cmp-b-gross>—</dd></div><div><dt>B 返还</dt><dd data-cmp-b-rebate>—</dd></div><div><dt>B 净成本</dt><dd data-cmp-b-net>—</dd></div><div><dt>净成本差</dt><dd data-cmp-gap>—</dd></div></dl>
                <p>每组先把手续费取整到分，再把返还取整到分；最终以官方规则和账单为准。</p><small data-cmp-copy-status role="status" aria-live="polite"></small>
            </section>
        </form>
    </main>

    <footer class="bd51-ledge">
        <p class="bd51-ledge-line">结果按输入费率估算，实际以各平台结算为准；不构成投资建议。</p>
    </footer>

    <script src="site.js"></script>
</body>
</html>
