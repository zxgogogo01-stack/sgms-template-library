<!DOCTYPE html>
<html lang="%%LANG%%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空格子 — %%SITE_NAME%%</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/site.css">
    <style>
        .void-dish {
            max-width: 460px;
            margin: 15vh auto;
            padding: 52px 40px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: var(--arc);
            box-shadow: var(--lift-up);
        }
        .void-dish h1 {
            font-size: 3.2rem;
            background: linear-gradient(120deg, var(--deep-2), var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .void-dish p { color: var(--dim); }
    </style>
</head>
<body>
    <div class="void-dish">
        <h1>404</h1>
        <p>这个格子是空的——页面不存在或已移动。</p>
        <p><a class="knap knap-solid" href="index.html">回便当格首页</a></p>
    </div>
</body>
</html>
