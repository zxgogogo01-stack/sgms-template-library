<!DOCTYPE html>
<html lang="{LANG}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f3f6">
    <title>优惠叠加计算器 — {SITE_NAME}</title>
    <meta name="description" content="基础费率乘上一层层减免，算出叠加后的最终费率。">
    <link rel="canonical" href="https://{SITE_DOMAIN}/tool.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{SITE_NAME}">
    <meta property="og:title" content="优惠叠加计算器 — {SITE_NAME}">
    <meta property="og:description" content="基础费率乘上一层层减免，算出叠加后的最终费率。">
    <meta property="og:url" content="https://{SITE_DOMAIN}/tool.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/shelf.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "优惠叠加计算器",
        "url": "https://{SITE_DOMAIN}/tool.html"
    }
    </script>
    <style>
        .tillbay { max-width: 540px; margin: 0 auto; padding: 46px 24px 80px; }
        .tillbay-card {
            background: var(--shelfwhite);
            border: 1.5px solid var(--threadline);
            border-top: 4px solid var(--denim);
            border-radius: calc(var(--crease) + 4px);
            box-shadow: var(--drape-hi);
            padding: 40px 44px;
        }
        .tillbay-card h1 { font-family: var(--serif75); font-size: 1.48rem; }
        .tillbay-card > p { color: var(--slatemute); margin: 6px 0 8px; }
        .tillbay-card label {
            display: block;
            margin: 16px 0 6px;
            font-size: .86rem;
            font-weight: 800;
            color: var(--denim-deep);
        }
        .tillbay-card input {
            width: 100%;
            min-height: 47px;
            padding: 10px 15px;
            border: 1.5px solid var(--threadline);
            border-radius: 11px;
            background: var(--linenfog);
            color: var(--denimink);
            font: inherit;
            font-family: var(--mono75);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--tug), box-shadow var(--tug);
        }
        .tillbay-card input:focus {
            outline: none;
            border-color: var(--denim);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--denim) 15%, transparent);
        }
        .tillbay-card input[aria-invalid="true"] {
            border-color: #b42318;
            box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 14%, transparent);
        }
        .tillbay-run {
            margin-top: 26px;
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: var(--crease);
            background: var(--denim);
            color: #f2f6fd;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .06em;
            cursor: pointer;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--denim) 34%, transparent);
            transition: transform var(--tug), background var(--tug);
        }
        .tillbay-run:hover { transform: translateY(-2px); background: var(--denim-deep); }
        .tillbay-out {
            display: block;
            margin-top: 18px;
            min-height: 26px;
            padding: 15px 19px;
            border-radius: 11px;
            background: var(--palewash);
            line-height: 1.78;
            font-variant-numeric: tabular-nums;
        }
        .tillbay-out b { color: var(--denim-deep); }
        @media (max-width: 600px) {
            .tillbay-card { padding: 26px 20px; }
        }
    </style>
</head>
<body>
    <header class="shopfront">
        <div class="shopfront-in">
            <a class="shopfront-brand" href="index.html">{BRAND_EN}</a>
            <button type="button" class="shopfront-btn" id="shopfront-btn" aria-label="主导航" aria-expanded="false" aria-controls="shopfront-nav">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <nav class="shopfront-nav" id="shopfront-nav" aria-label="主导航">
                <a href="index.html">货架</a>
                <a href="article.html">导购</a>
                <a href="tool.html" aria-current="page">叠加计算</a>
                <a href="legal.html">披露</a>
            </nav>
        </div>
    </header>

    <main class="tillbay">
        <form class="tillbay-card" id="sd-form" novalidate>
            <h1>优惠叠加计算器</h1>
            <p>两层折扣不是简单相加。填三个数，看真正到手的费率。本地计算。</p>
            <label for="sd-base">基础费率（%）</label>
            <input type="number" id="sd-base" step="any" min="0" max="100" placeholder="如 0.1" aria-describedby="sd-out">
            <label for="sd-d1">第一层减免（%，如邀请码 20）</label>
            <input type="number" id="sd-d1" step="any" min="0" max="100" placeholder="如 20" aria-describedby="sd-out">
            <label for="sd-d2">第二层减免（%，如活动，可留空）</label>
            <input type="number" id="sd-d2" step="any" min="0" max="100" placeholder="如 10" aria-describedby="sd-out">
            <button type="submit" class="tillbay-run" id="sd-run">算到手价</button>
            <output class="tillbay-out" id="sd-out" role="status" aria-live="polite"></output>
        </form>
    </main>

    <footer class="stockroom">
        <div class="stockroom-in">
            <p class="stockroom-fine">结果仅供参考，能否叠加以平台规则为准。</p>
        </div>
    </footer>

    <script src="shelf.js"></script>
</body>
</html>
