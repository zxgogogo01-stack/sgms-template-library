<!DOCTYPE html>
<html lang="{LANG}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缺货 — {SITE_NAME}</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/shelf.css">
    <style>
        .emptyshelf { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
        .emptyshelf-card {
            background: var(--shelfwhite);
            border: 1.5px dashed var(--threadline);
            border-radius: calc(var(--crease) + 4px);
            box-shadow: var(--drape-hi);
            padding: 50px 40px;
        }
        .emptyshelf-card h1 {
            font-family: var(--serif75);
            font-size: 3.2rem;
            color: var(--denim);
            font-variant-numeric: tabular-nums;
        }
        .emptyshelf-card p { color: var(--slatemute); margin: 8px 0 22px; }
    </style>
</head>
<body>
    <div class="emptyshelf">
        <div class="emptyshelf-card">
            <h1>404</h1>
            <p>这个货位是空的——商品不存在或已下架。</p>
            <a class="stitch stitch-full" href="index.html">回货架</a>
        </div>
    </div>
</body>
</html>
