<!DOCTYPE html>
<html lang="{LANG}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f3f6">
    <title>披露与免责 — {SITE_NAME}</title>
    <meta name="description" content="{SITE_NAME} 的利益披露与免责声明。">
    <link rel="canonical" href="https://{SITE_DOMAIN}/legal.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{SITE_NAME}">
    <meta property="og:title" content="披露与免责 — {SITE_NAME}">
    <meta property="og:description" content="{SITE_NAME} 的利益披露与免责声明。">
    <meta property="og:url" content="https://{SITE_DOMAIN}/legal.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/shelf.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "披露与免责",
        "url": "https://{SITE_DOMAIN}/legal.html"
    }
    </script>
    <style>
        .noticeboard { max-width: 680px; margin: 0 auto; padding: 44px 24px 80px; }
        .noticeboard h1 { font-family: var(--serif75); font-size: 1.75rem; }
        .noticeboard-meta { margin: 8px 0 24px; font-size: .84rem; color: var(--slatemute); font-variant-numeric: tabular-nums; }
        .shelfnote {
            background: var(--shelfwhite);
            border: 1.5px solid var(--threadline);
            border-radius: var(--crease);
            box-shadow: var(--drape);
            padding: 22px 28px;
            margin-bottom: 13px;
            border-left: 4px solid var(--denim);
        }
        .shelfnote:nth-child(odd) { border-left-color: var(--stitchgold); }
        .shelfnote h2 { font-family: var(--serif75); font-size: 1.04rem; margin-bottom: 7px; color: var(--denim-deep); }
        .shelfnote p { margin: 0; color: var(--slatemute); }
    </style>
</head>
<body>
    <header class="shopfront">
        <div class="shopfront-in">
            <a class="shopfront-brand" href="index.html">{BRAND_EN}</a>
            <button type="button" class="shopfront-btn" id="shopfront-btn" aria-label="主导航" aria-expanded="false" aria-controls="shopfront-nav">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <nav class="shopfront-nav" id="shopfront-nav" aria-label="主导航">
                <a href="index.html">货架</a>
                <a href="article.html">导购</a>
                <a href="tool.html">叠加计算</a>
                <a href="legal.html" aria-current="page">披露</a>
            </nav>
        </div>
    </header>

    <main class="noticeboard">
        <h1>披露与免责</h1>
        <p class="noticeboard-meta">更新 2026-01-19</p>

        <section class="shelfnote">
            <h2>利益披露</h2>
            <p>本站（{SITE_DOMAIN}）展示交易平台邀请码。用码注册不会多付费用，还能享最高 20% 手续费减免*（* 实际比例以交易所页面显示为准，可能随政策调整）。</p>
        </section>

        <section class="shelfnote">
            <h2>上架口径</h2>
            <p>货架条目为公开信息整理，注明核对时间；平台规则随时调整，以官方页面实时显示为准。</p>
        </section>

        <section class="shelfnote">
            <h2>免责声明</h2>
            <p>内容不构成投资建议；数字资产波动剧烈，请自行评估风险。</p>
        </section>

        <section class="shelfnote">
            <h2>更正与联系</h2>
            <p>纠错请附条目与依据：{CONTACT_EMAIL}。查实即更正并注明时间。</p>
        </section>
    </main>

    <footer class="stockroom">
        <div class="stockroom-in">
            <p class="stockroom-fine">内容以各平台官方页面为准；不构成投资建议。</p>
        </div>
    </footer>

    <script src="shelf.js"></script>
</body>
</html>
