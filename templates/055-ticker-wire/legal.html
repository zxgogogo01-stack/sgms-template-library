<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#0e1118'>
    <title>披露与免责 — {SITE_NAME}</title>
    <meta name='description' content='{SITE_NAME} 的利益披露与免责声明。'>
    <link rel='canonical' href='https://{SITE_DOMAIN}/legal.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='{SITE_NAME}'>
    <meta property='og:title' content='披露与免责 — {SITE_NAME}'>
    <meta property='og:description' content='{SITE_NAME} 的利益披露与免责声明。'>
    <meta property='og:url' content='https://{SITE_DOMAIN}/legal.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='skin.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "披露与免责",
        "url": "https://{SITE_DOMAIN}/legal.html"
    }
    </script>
    <style>
        /* disclosure extras */
        .lawwrap { max-width: 680px; margin: 0 auto; padding: 44px 24px 80px; }
        .lawwrap h1 { font-size: 1.8rem; }
        .law-meta { margin: 10px 0 24px; font-size: .84rem; color: var(--shade5); }
        .law-card {
            border-radius: var(--rr);
            background: var(--slab5);
            box-shadow: var(--dk), inset 0 0 0 1px var(--seam5);
            padding: 22px 28px;
            margin-bottom: 14px;
        }
        .law-card h2 {
            font-size: 1.04rem;
            margin-bottom: 8px;
            color: var(--glowline);
        }
        .law-card h2::before { content: '# '; font-family: var(--monox); }
        .law-card p { margin: 0; color: var(--grey5); }
    </style>
</head>
<body>
    <header class='console'>
        <div class='console-in'>
            <a class='callsign' href='index.html'>{BRAND_EN}<span class='callsign-cue'>_</span></a>
            <button type='button' class='console-btn' id='console-btn' aria-label='主导航' aria-expanded='false' aria-controls='console-nav'>
                <svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M3 6h18M3 12h18M3 18h18'/></svg>
            </button>
            <nav class='console-nav' id='console-nav' aria-label='主导航'>
                <a href='index.html'>快讯台</a>
                <a href='article.html'>专栏</a>
                <a href='tool.html'>计算台</a>
                <a href='legal.html' aria-current='page'>披露</a>
            </nav>
        </div>
    </header>

    <main class='lawwrap'>
        <h1>披露与免责</h1>
        <p class='law-meta'>更新 2026-01-19</p>

        <section class='law-card'>
            <h2>利益披露</h2>
            <p>本站（{SITE_DOMAIN}）展示交易平台邀请码。用码注册不会多付费用，还能享最高 20% 手续费减免*（* 实际比例以交易所页面显示为准，可能随政策调整）。</p>
        </section>

        <section class='law-card'>
            <h2>快讯口径</h2>
            <p>快讯为公开信息转述，逐条注明来源与核对时间；平台规则随时调整，以官方页面实时显示为准。</p>
        </section>

        <section class='law-card'>
            <h2>免责声明</h2>
            <p>内容为信息整理，不构成投资建议；数字资产波动剧烈，请自行评估风险。</p>
        </section>

        <section class='law-card'>
            <h2>更正与联系</h2>
            <p>纠错请附条目与依据：{CONTACT_EMAIL}。查实即更正并注明时间。</p>
        </section>
    </main>

    <footer class='dockend'>
        <p class='de-line'>快讯以各平台官方页面为准；不构成投资建议。</p>
    </footer>

    <script src='deck.js'></script>
</body>
</html>
