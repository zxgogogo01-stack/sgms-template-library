<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#0e1118'>
    <title>快讯时效检查器 — {SITE_NAME}</title>
    <meta name='description' content='比较发布时间与核验时间，按自定义阈值标记快讯新鲜度。'>
    <link rel='canonical' href='https://{SITE_DOMAIN}/tool.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='{SITE_NAME}'>
    <meta property='og:title' content='快讯时效检查器 — {SITE_NAME}'>
    <meta property='og:description' content='比较发布时间与核验时间，按自定义阈值标记快讯新鲜度。'>
    <meta property='og:url' content='https://{SITE_DOMAIN}/tool.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='skin.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "快讯时效检查器",
        "url": "https://{SITE_DOMAIN}/tool.html"
    }
    </script>
    <style>
        /* converter extras */
        .tw55-convwrap { max-width: 540px; margin: 0 auto; padding: 46px 24px 80px; }
        .tw55-convcard {
            border-radius: var(--rr);
            background: var(--slab5);
            box-shadow: var(--dk-hi), inset 0 0 0 1px var(--seam5);
            padding: 40px 44px;
            position: relative;
        }
        .tw55-convcard::before {
            content: '';
            position: absolute;
            top: 0; left: 24px; right: 24px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--glowline), transparent);
        }
        .tw55-convcard h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .tw55-convcard > p { color: var(--shade5); margin: 0 0 14px; }
        .tw55-convcard label {
            display: block;
            margin: 16px 0 6px;
            font-family: var(--monox);
            font-size: .8rem;
            letter-spacing: .1em;
            color: var(--grey5);
        }
        .tw55-convcard input {
            width: 100%;
            min-height: 47px;
            padding: 10px 15px;
            border: 1px solid var(--seam5);
            border-radius: 9px;
            background: var(--pit);
            color: var(--white5);
            font: inherit;
            font-family: var(--monox);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--zip), box-shadow var(--zip);
        }
        .tw55-convcard input:focus {
            outline: none;
            border-color: var(--glowline);
            box-shadow: 0 0 0 4px rgba(62, 230, 193, .14);
        }
        .tw55-convcard input[aria-invalid='true'] {
            border-color: #ff7b8b;
            box-shadow: 0 0 0 4px rgba(255, 123, 139, .16);
        }
        .tw55-conv-run {
            margin-top: 26px;
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 9px;
            background: var(--glowline);
            color: #06211a;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .08em;
            cursor: pointer;
            box-shadow: 0 10px 26px rgba(62, 230, 193, .28);
            transition: transform var(--zip), background var(--zip), box-shadow var(--zip);
        }
        .tw55-conv-run:hover { transform: translateY(-2px); background: var(--glowline-2); box-shadow: 0 14px 32px rgba(62, 230, 193, .4); }
        .tw55-conv-run:active { transform: translateY(0); }
        .tw55-conv-out {
            display: block;
            margin-top: 18px;
            min-height: 24px;
            padding: 14px 18px;
            border-radius: 9px;
            background: var(--pit);
            box-shadow: inset 0 0 0 1px var(--seam5);
            color: var(--grey5);
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 620px) {
            .tw55-convcard { padding: 26px 22px; }
        }
    </style>
</head>
<body>
    <a class='tw55-skip' href='#tw55-main'>跳到主要内容</a>
    <header class='tw55-console'>
        <div class='tw55-console-in'>
            <a class='tw55-callsign' href='index.html'>{BRAND_EN}<span class='tw55-callsign-cue'>_</span></a>
            <button type='button' class='tw55-console-btn' id='tw55-console-btn' aria-label='主导航' aria-expanded='false' aria-controls='tw55-console-nav'>
                <svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M3 6h18M3 12h18M3 18h18'/></svg>
            </button>
            <nav class='tw55-console-nav' id='tw55-console-nav' aria-label='主导航'>
                <a href='index.html'>快讯台</a>
                <a href='article.html'>专栏</a>
                <a href='tool.html' aria-current='page'>时效台</a>
                <a href='legal.html'>披露</a>
                <button type='button' class='tw55-theme' id='tw55-theme-button' aria-label='切换到浅色模式'>浅色</button>
            </nav>
        </div>
    </header>

    <main class='tw55-convwrap' id='tw55-main'>
        <form class='tw55-convcard' id='tw55-age-form' novalidate>
            <p class='tw55-age-kicker'>FRESHNESS WINDOW / SAME CLOCK</p>
            <h1>快讯时效检查器</h1>
            <p>用同一时区的发布时间和核验时间判断线索是否仍在时效窗内。本地计算。</p>
            <label for='tw55-age-issued'>快讯发布时间</label>
            <input type='datetime-local' id='tw55-age-issued' name='issued' required aria-describedby='tw55-age-help tw55-age-message'>
            <label for='tw55-age-checked'>核验时间</label>
            <input type='datetime-local' id='tw55-age-checked' name='checked' required aria-describedby='tw55-age-help tw55-age-message'>
            <label for='tw55-age-threshold'>新鲜阈值（分钟）</label>
            <input type='text' id='tw55-age-threshold' name='threshold' inputmode='numeric' autocomplete='off' required placeholder='如 60' aria-describedby='tw55-age-help tw55-age-message'>
            <small id='tw55-age-help'>时间须在 2000–2099 年且使用同一时区；阈值只接受 1–10080 的整数。</small>
            <div class='tw55-age-presets'><button type='button' data-age-preset='2026-01-19T10:00,2026-01-19T10:45,60'>新鲜 45 分钟</button><button type='button' data-age-preset='2026-01-19T10:00,2026-01-19T11:30,60'>复核 90 分钟</button><button type='button' data-age-preset='2026-01-19T10:00,2026-01-19T12:01,60'>过时 121 分钟</button></div>
            <p class='tw55-age-message' id='tw55-age-message' role='alert' aria-live='polite' aria-atomic='true'></p>
            <div class='tw55-age-actions'><button type='submit' class='tw55-conv-run' id='tw55-age-run'>检查时效</button><button type='button' data-age-reset>清空</button></div>
            <section class='tw55-conv-out tw55-age-out' aria-live='polite' aria-atomic='true'><header><span data-age-state>等待输入</span><button type='button' data-copy-age disabled>复制结果</button></header><output data-age-result>—</output><meter min='0' max='120' value='0' data-age-meter>0</meter><dl><div><dt>时效阈值</dt><dd data-age-window>—</dd></div><div><dt>核验结论</dt><dd data-age-verdict>—</dd></div><div><dt>发布时间</dt><dd data-age-issued-result>—</dd></div><div><dt>核验时间</dt><dd data-age-checked-result>—</dd></div></dl><p>不同时区须先换算；超过两倍阈值标为过时。</p><small data-age-copy-status role='status' aria-live='polite'></small></section>
        </form>
    </main>

    <footer class='tw55-dockend'>
        <p class='tw55-de-line'>时效标签只辅助内容核验，不替代对官方页面与账户状态的复查。</p>
    </footer>

    <script src='deck.js'></script>
</body>
</html>
