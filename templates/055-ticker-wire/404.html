<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>信号中断 — {SITE_NAME}</title>
    <meta name='robots' content='noindex'>
    <link rel='stylesheet' href='skin.css'>
    <style>
        /* 404 extras */
        .tw55-lost5 {
            max-width: 440px;
            margin: 15vh auto;
            padding: 0 24px;
            text-align: center;
        }
        .tw55-lost5-card {
            border-radius: var(--rr);
            background: var(--slab5);
            box-shadow: var(--dk-hi), inset 0 0 0 1px var(--seam5);
            padding: 50px 40px;
        }
        .tw55-lost5-card h1 {
            font-family: var(--monox);
            font-size: 3rem;
            color: var(--glowline);
            text-shadow: 0 0 24px rgba(62, 230, 193, .4);
        }
        .tw55-lost5-card p { color: var(--shade5); }
        .tw55-lost5-card .tw55-key-lit { margin-top: 10px; }
    </style>
</head>
<body>
    <a class='tw55-skip' href='#tw55-main'>跳到主要内容</a>
    <header class='tw55-console'><div class='tw55-console-in'><a class='tw55-callsign' href='index.html'>{BRAND_EN}<span class='tw55-callsign-cue'>_</span></a><button type='button' class='tw55-console-btn' id='tw55-console-btn' aria-label='主导航' aria-expanded='false' aria-controls='tw55-console-nav'><svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M3 6h18M3 12h18M3 18h18'/></svg></button><nav class='tw55-console-nav' id='tw55-console-nav' aria-label='主导航'><a href='index.html'>快讯台</a><a href='article.html'>专栏</a><a href='tool.html'>时效台</a><a href='legal.html'>披露</a><button type='button' class='tw55-theme' id='tw55-theme-button' aria-label='切换到浅色模式'>浅色</button></nav></div></header>
    <main class='tw55-lost5' id='tw55-main'>
        <div class='tw55-lost5-card'>
            <h1>404</h1>
            <p>信号中断——这条线路不存在或已改道。</p>
            <a class='tw55-key tw55-key-lit' href='index.html'>回快讯台</a>
            <form class='tw55-wire-search' data-wire-search novalidate><label for='tw55-wire-query'>搜索快讯线路</label><div><input id='tw55-wire-query' name='query' type='search' maxlength='80' autocomplete='off' aria-describedby='tw55-wire-help tw55-wire-feedback' placeholder='如：费率、时效、披露'><button type='submit'>接通信号</button></div><small id='tw55-wire-help'>最多 80 个字符，只检索这套模板的主要页面。</small><p id='tw55-wire-feedback' data-wire-feedback role='status' aria-live='polite'>可搜索快讯、核验、时效和披露。</p></form>
        </div>
    </main>
    <script src='deck.js'></script>
</body>
</html>
