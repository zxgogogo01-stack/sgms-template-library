<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>信号中断 — {SITE_NAME}</title>
    <meta name='robots' content='noindex'>
    <link rel='stylesheet' href='skin.css'>
    <style>
        /* 404 extras */
        .lost5 {
            max-width: 440px;
            margin: 15vh auto;
            padding: 0 24px;
            text-align: center;
        }
        .lost5-card {
            border-radius: var(--rr);
            background: var(--slab5);
            box-shadow: var(--dk-hi), inset 0 0 0 1px var(--seam5);
            padding: 50px 40px;
        }
        .lost5-card h1 {
            font-family: var(--monox);
            font-size: 3rem;
            color: var(--glowline);
            text-shadow: 0 0 24px rgba(62, 230, 193, .4);
        }
        .lost5-card p { color: var(--shade5); }
        .lost5-card .key-lit { margin-top: 10px; }
    </style>
</head>
<body>
    <div class='lost5'>
        <div class='lost5-card'>
            <h1>404</h1>
            <p>信号中断——这条线路不存在或已改道。</p>
            <a class='key key-lit' href='index.html'>回快讯台</a>
        </div>
    </div>
</body>
</html>
