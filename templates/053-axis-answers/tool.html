<!DOCTYPE html>
<html lang='~LANG~'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#2b3a55'>
    <title>净费率计算 — ~SITE_NAME~</title>
    <meta name='description' content='名义费率乘以减免比例，得到实际净费率。'>
    <link rel='canonical' href='https://~SITE_DOMAIN~/tool.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='~SITE_NAME~'>
    <meta property='og:title' content='净费率计算 — ~SITE_NAME~'>
    <meta property='og:description' content='名义费率乘以减免比例，得到实际净费率。'>
    <meta property='og:url' content='https://~SITE_DOMAIN~/tool.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='assets/main.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "净费率计算",
        "url": "https://~SITE_DOMAIN~/tool.html"
    }
    </script>
    <style>
        /* 计算页补充 */
        .aa53-nf {
            max-width: 520px;
            margin: 0 auto;
            padding: 46px 24px 80px;
            text-align: center;
        }
        .aa53-nf-card {
            background: var(--panel);
            border: 1px solid var(--seam);
            border-radius: var(--curve);
            box-shadow: var(--haze-hi);
            padding: 42px 44px;
            text-align: left;
        }
        .aa53-nf-card h1 { font-size: 1.5rem; text-align: center; }
        .aa53-nf-card > p { color: var(--hush); margin: 8px 0 14px; text-align: center; }
        .aa53-nf-card label {
            display: block;
            margin: 16px 0 6px;
            font-size: .88rem;
            font-weight: 650;
            color: var(--letter-2);
        }
        .aa53-nf-card input {
            width: 100%;
            min-height: 47px;
            padding: 10px 15px;
            border: 1.5px solid var(--seam);
            border-radius: 999px;
            background: var(--ivory);
            color: var(--letter);
            font: inherit;
            text-align: center;
            font-variant-numeric: tabular-nums;
            transition: border-color var(--beat), box-shadow var(--beat);
        }
        .aa53-nf-card input:focus {
            outline: none;
            border-color: var(--apricot);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--apricot) 20%, transparent);
        }
        .aa53-nf-card input[aria-invalid='true'] {
            border-color: #b42318;
            box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 18%, transparent);
        }
        .aa53-nf-run {
            margin-top: 26px;
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 999px;
            background: var(--night);
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .08em;
            cursor: pointer;
            box-shadow: 0 10px 26px color-mix(in srgb, var(--night) 38%, transparent);
            transition: transform var(--beat), background var(--beat);
        }
        .aa53-nf-run:hover { transform: translateY(-2px); background: var(--night-2); }
        .aa53-nf-run:active { transform: translateY(0); }
        .aa53-nf-out {
            display: block;
            margin-top: 18px;
            min-height: 24px;
            padding: 14px 20px;
            border-radius: var(--curve);
            background: var(--apricot-mist);
            color: var(--letter-2);
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 620px) {
            .aa53-nf-card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <a class='aa53-skip' href='#aa53-main'>跳到主要内容</a>
    <header class='aa53-spine-top'>
        <a class='aa53-brandline' href='index.html'>~BRAND_EN~</a>
        <button type='button' class='aa53-spine-btn' id='aa53-spine-btn' aria-label='主导航' aria-expanded='false' aria-controls='aa53-spine-nav'>
            <svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M3 6h18M3 12h18M3 18h18'/></svg>
        </button>
        <nav class='aa53-spine-nav' id='aa53-spine-nav' aria-label='主导航'>
            <a href='index.html'>答疑轴</a>
            <a href='article.html'>长答</a>
            <a href='tool.html' aria-current='page'>净费率</a>
            <a href='legal.html'>披露</a>
            <button type='button' class='aa53-theme' id='aa53-theme-button' aria-label='切换到夜间模式'>夜间</button>
        </nav>
    </header>

    <main class='aa53-nf' id='aa53-main'>
        <form class='aa53-nf-card' id='aa53-nf-form' novalidate>
            <h1>净费率计算</h1>
            <p>名义费率 ×（1 − 减免比例）＝净费率，并换算每 10,000 成交额的费用。本地精确计算。</p>
            <label for='aa53-nf-rate'>名义费率（%）</label>
            <input type='number' id='aa53-nf-rate' name='rate' step='any' min='0' max='100' inputmode='decimal' required placeholder='如 0.1' aria-describedby='aa53-nf-help aa53-nf-message'>
            <label for='aa53-nf-off'>减免比例（%）</label>
            <input type='number' id='aa53-nf-off' name='discount' step='any' min='0' max='100' inputmode='decimal' required placeholder='如 20' aria-describedby='aa53-nf-help aa53-nf-message'>
            <small id='aa53-nf-help'>两项均为 0–100 的普通十进制数，最多 6 位小数。</small>
            <div class='aa53-nf-presets'><button type='button' data-nf-preset='0.1,20'>示例：0.1% / 减免 20%</button><button type='button' data-nf-preset='0.075,0'>示例：无减免</button><button type='button' data-nf-preset='0.2,100'>示例：全额减免</button></div>
            <p class='aa53-nf-message' id='aa53-nf-message' role='alert' aria-live='polite' aria-atomic='true'></p>
            <div class='aa53-nf-actions'><button type='submit' class='aa53-nf-run' id='aa53-nf-go'>算净费率</button><button type='button' data-nf-reset>清空</button></div>
            <section class='aa53-nf-out' id='aa53-nf-out' aria-live='polite' aria-atomic='true'><header><span data-nf-state>等待输入</span><button type='button' data-copy-nf disabled>复制结果</button></header><output data-nf-rate-result>—</output><dl><div><dt>每 10,000 名义费用</dt><dd data-nf-gross>—</dd></div><div><dt>每 10,000 减免费用</dt><dd data-nf-saving>—</dd></div><div><dt>每 10,000 净费用</dt><dd data-nf-net>—</dd></div></dl><p>费率保留最多 8 位小数；金额按分四舍五入。</p><small data-nf-copy-status role='status' aria-live='polite'></small></section>
        </form>
    </main>

    <footer class='aa53-spine-end'>
        <p class='aa53-se-line'>结果仅供参考，实际以平台页面显示为准。</p>
    </footer>

    <script src='assets/wire.js'></script>
</body>
</html>
