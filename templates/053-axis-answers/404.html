        /* 404 补充 */
        .aa53-snap-well {
            min-height: calc(100vh - 224px);
            display: grid;
            place-items: center;
            padding: clamp(48px, 9vh, 96px) 24px;
        }
        .aa53-snap {
            width: min(100%, 440px);
            max-width: 440px;
            padding: 0 24px;
            text-align: center;
        }
        .aa53-snap-line {
            width: 2px;
            height: 60px;
            margin: 0 auto 22px;
            background: linear-gradient(var(--apricot), transparent);
        }
        .aa53-snap h1 {
            font-size: 3.4rem;
            color: var(--night);
        }
        .aa53-snap p { color: var(--hush); }
        @media (max-width: 620px) {
            .aa53-snap-well { min-height: calc(100vh - 264px); padding-inline: 18px; }
        }
    </style>
</head>
