  <style>
    .charterhall { max-width: 700px; margin: 0 auto; padding: 50px 26px 88px; }
    .charterhall h1 { font-family: var(--serif76); font-size: 1.9rem; }
    .charterhall-meta { margin: 8px 0 28px; font-family: var(--mono76); font-size: .82rem; color: var(--dovemute); }
    .wallplate {
      background: var(--plinthwhite);
      border: 1px solid var(--hairfine);
      box-shadow: var(--floatv);
      padding: 24px 30px;
      margin-bottom: 16px;
      counter-increment: wp;
    }
    .charterhall { counter-reset: wp; }
    .wallplate h2 {
      font-family: var(--serif76);
      font-size: 1.08rem;
      margin-bottom: 8px;
    }
    .wallplate h2::before {
      content: counter(wp, decimal-leading-zero) ' — ';
      font-family: var(--mono76);
      font-size: .82em;
      color: var(--magenta76);
    }
    .wallplate p { margin: 0; color: var(--dovemute); }
  </style>
</head>
<body>
  <header class='vestibule'>

      <a class='vestibule-brand' href='index.html'>%%BRAND_EN%%</a>

        <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>

      <p>纠错请附条目与依据：%%CONTACT_EMAIL%%。查实即更正并注明时间。</p>
    </section>
  </main>

  <footer class='cloakroom'>
    <div class='cloakroom-in'>
      <p class='cloakroom-fine'>内容以各平台官方页面为准；不构成投资建议。</p>
    </div>
