<!DOCTYPE html>
<html lang="%%LANG%%">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探测不到 — %%SITE_NAME%%</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/status.css">
  <style>
    /* 404 extras */
    .darkzone { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
    .darkzone-card {
      background: var(--sheet66);
      border: 1px solid var(--rim66);
      border-top: 4px solid var(--alarm66);
      border-radius: var(--corner66);
      box-shadow: var(--float66-hi);
      padding: 48px 40px;
    }
    .darkzone-card h1 {
      font-family: var(--mono66);
      font-size: 3rem;
      letter-spacing: .1em;
      color: var(--alarm66);
    }
    .darkzone-card p { color: var(--mute66); margin: 8px 0 22px; }
    .darkzone-back {
      display: inline-block;
      min-height: 46px;
      line-height: 46px;
      padding: 0 26px;
      border-radius: 10px;
      background: var(--live66);
      color: #f2fbf5;
      font-weight: 800;
      transition: transform var(--tap66), background var(--tap66);
    }
    .darkzone-back:hover { transform: translateY(-2px); background: var(--live66-deep); }
  </style>
</head>
<body>
  <div class="darkzone">
    <div class="darkzone-card">
      <h1>404</h1>
      <p><span class="beacon beacon-down"></span> 这个端点探测不到——页面不存在或已下线。</p>
      <a class="darkzone-back" href="index.html">回监控台</a>
    </div>
  </div>
</body>
</html>
