<!DOCTYPE html><html lang="[[LANG]]"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#722c36"><title>听雨 · [[SITE_NAME]]</title><meta name="description" content="听雨词条的释义、用例与相关词。"><link rel="canonical" href="https://[[SITE_DOMAIN]]/article.html"><meta property="og:type" content="article"><meta property="og:title" content="听雨"><meta property="og:description" content="听雨词条的释义、用例与相关词。"><meta property="og:url" content="https://[[SITE_DOMAIN]]/article.html"><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="static/lexicon.css"></head><body><header class="lexbar"><div class="lexbar-in"><a class="lexbar-brand" href="index.html">[[BRAND_EN]]</a><button class="lexbar-btn" id="lexbar-btn" type="button" aria-label="主导航" aria-expanded="false" aria-controls="lexbar-nav">索引</button><nav class="lexbar-nav" id="lexbar-nav"><a href="index.html">辞书</a><a href="article.html" aria-current="page">释义</a><a href="tool.html">检字</a><a href="legal.html">凡例</a></nav></div></header><main class="lex-page"><nav class="lex-crumb"><a href="index.html">辞书</a><span>/</span><span>风物部</span><span>/</span><span>听雨</span></nav><article class="lex-entry"><header><p>HEADWORD · 001</p><h1>听雨</h1><em>风物 · 动宾</em><div class="lex-pronounce"><span>tīng yǔ</span><b>听 · 雨</b></div></header><div class="lex-defs"><section><strong>1.</strong><div><h2>本义</h2><p>静坐檐下，辨认雨落在瓦、叶、石阶与水面的不同声响。</p><blockquote>夜深时雨落得慢，灯下只剩书页与檐声。</blockquote></div></section><section><strong>2.</strong><div><h2>引申</h2><p>在连续而细密的自然声响中收束心绪，使纷杂的念头渐次沉静。</p></div></section><section><strong>3.</strong><div><h2>用例</h2><p>春日听雨；客窗听雨；闭门听雨；与故人隔城同听一场雨。</p></div></section></div><footer class="lex-related"><b>参见</b><a href="article.html">檐声</a><a href="article.html">夜读</a><a href="article.html">山岚</a></footer></article></main><footer class="lexfoot"><div class="lexfoot-in"><p>[[BRAND_EN]] · [[SITE_TAGLINE]]</p><small>本词条为可替换的静态示例。</small></div></footer><scrip
