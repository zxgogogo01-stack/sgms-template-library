<!DOCTYPE html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工单助手 — {{SITE_NAME}}</title><meta name="description" content="在本地整理一份完整、可复制的问题报告。"><link rel="canonical" href="https://{{SITE_DOMAIN}}/tool.html"><link rel="stylesheet" href="assets/anchor.css"><link rel="stylesheet" href="assets/berth.css"><link rel="stylesheet" href="assets/rope.css"><link rel="stylesheet" href="assets/boutique.css"></head><body>
<header class="brow"><a class="brow__site" href="index.html">{{SITE_NAME}}</a><nav class="brow__lane" aria-label="主导航"><a class="brow__stop" href="index.html">支持首页</a><a class="brow__stop" href="article.html">安全指南</a><a class="brow__stop" href="tool.html" aria-current="page">工单助手</a><a class="brow__stop" href="legal.html">服务说明</a></nav></header>
<main class="cabin cabin--ticket"><section class="plain plain--ticket"><p class="plain__label">TICKET BUILDER / LOCAL ONLY</p><h1 class="plain__h">把问题整理清楚，<br>让支持人员少猜一步。</h1><p class="plain__p">填写内容只在当前浏览器中处理，不会自动发送或保存。</p><div class="ticket-note"><span>提交前准备</span><strong>问题现象 · 发生时间 · 错误提示 · 已尝试步骤</strong></div></section>
<form class="ticket ticket--pro" id="ticket-form" novalidate><header><p>01 / ISSUE REPORT</p><h2>生成问题报告</h2><span>必填项以 * 标注</span></header>
  <div class="ticket__field"><label for="tk-type">问题分类 *</label><select id="tk-type" aria-describedby="ticket-state" required><option value="">请选择分类</option><option>账户与登录</option><option>费用与结算</option><option>邀请码</option><option>其他问题</option></select></div>
  <div class="ticket__field ticket__field--wide"><label for="tk-what">问题描述 *</label><textarea id="tk-what" placeholder="发生了什么？你原本希望看到什么？" aria-describedby="ticket-state" required></textarea><small>请勿填写密码、验证码或恢复码。</small></div>
  <div class="ticket__field"><label for="tk-when">发生时间</label><input type="datetime-local" id="tk-when"></div>
  <div class="ticket__field"><label for="tk-error">错误提示</label><input type="text" id="tk-error" placeholder="请尽量原样填写"></div>
  <div class="ticket__field ticket__field--wide"><label for="tk-tried">已尝试的办法</label><input type="text" id="tk-tried" placeholder="例如：重新登录、清除缓存、换浏览器"></div>
  <div class="ticket__actions"><button class="ticket__go" type="submit">生成工单文本</button><button class="ticket__reset" type="reset">清空</button></div>
  <div class="ticket__result"><div><p id="ticket-state" role="status" aria-live="polite" aria-atomic="true">等待填写</p><button type="button" id="ticket-copy" disabled>复制结果</button></div><label for="tk-out">生成结果</label><textarea id="tk-out" readonly placeholder="完成必填项后，报告会出现在这里。"></textarea></div>
</form></main><footer class="keel"><p class="keel__row">本工具不会自动提交工单 · 收件地址 {{CONTACT_EMAIL}}</p></footer><script src="assets/moor.js"></script></body></html>
