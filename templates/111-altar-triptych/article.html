<!DOCTYPE html><html lang="[[LANG]]"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#263d46"><title>风暴过后 · [[SITE_NAME]]</title><meta name="description" content="一篇由海岸、等待与归航组成的三联画式文章。"><link rel="canonical" href="https://[[SITE_DOMAIN]]/article.html"><meta property="og:type" content="article"><meta property="og:title" content="风暴过后"><meta property="og:description" content="一篇由海岸、等待与归航组成的三联画式文章。"><meta property="og:url" content="https://[[SITE_DOMAIN]]/article.html"><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="static/triptych.css"></head><body><header class="tripbar"><div class="tripbar-in"><a class="tripbar-brand" href="index.html">[[BRAND_EN]]</a><button class="tripbar-btn" id="tripbar-btn" type="button" aria-label="主导航" aria-expanded="false" aria-controls="tripbar-nav">三联</button><nav class="tripbar-nav" id="tripbar-nav"><a href="index.html">三联画</a><a href="article.html" aria-current="page">中央画</a><a href="tool.html">导览</a><a href="legal.html">铭牌</a></nav></div></header><main class="trip-page"><nav class="trip-crumb"><a href="index.html">三联画</a><span>/</span><span>中央画</span></nav><article class="trip-article"><header><p>CENTRAL PANEL · 01</p><h1>风暴过后，光从海面中央升起</h1><span>三段关于海岸、等待与归航的记述，在同一束晨光中重新相遇。</span></header><div class="trip-panels"><section><strong>左翼</strong><h2>海岸</h2><p>夜里最高的浪越过堤岸，清晨却只留下细碎泡沫。渔网挂在石墙上，一点点滴回安静。</p></section><section><strong>中央</strong><div aria-hidden="true">光</div><h2>等待</h2><p>灯塔仍亮着。守塔人把第三封信放在窗边，等海面出现第一道返回的船影。</p></section><section><strong>右翼</strong><h2>归航</h2><p>汽笛从雾后传来，岸上的人没有挥手。他们只是站得更近，让晨光越过肩膀。</p></section></div></article></main><footer class="tripfoot"><div class="tripfoot-in"><p>[[BRAND_EN]] · [[SITE_TAGLINE]]</p><small>本文为可替换的静态示例。</small></div></footer><script src="static/triptych.js"></script></body></html>
