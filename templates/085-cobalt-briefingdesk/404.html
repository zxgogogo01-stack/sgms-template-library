<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>简报缺页 — {SITE_NAME}</title>
    <meta name='robots' content='noindex'>
    <link rel='stylesheet' href='css/brief.css'>
    <style>
        /* 404 补充样式 */
        .voidmemo { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
        .voidmemo-card {
            background: var(--panewhite85);
            border-radius: calc(var(--bevel85) + 4px);
            box-shadow: var(--haze85-hi);
            border-top: 3px solid var(--tangerine85);
            padding: 50px 40px;
        }
        .voidmemo-card h1 {
            font-family: var(--serif85);
            font-size: 3.2rem;
            color: var(--cobalt);
            font-variant-numeric: tabular-nums;
        }
        .voidmemo-card p { color: var(--mutegrey85); margin: 8px 0 22px; }
        .voidmemo-back {
            display: inline-block;
            min-height: 46px;
            line-height: 46px;
            padding: 0 26px;
            border-radius: var(--bevel85);
            background: var(--cobalt);
            color: #f2f6fe;
            font-weight: 800;
            transition: transform var(--tickpace), background var(--tickpace);
        }
        .voidmemo-back:hover { transform: translateY(-2px); background: var(--cobalt-deep); }
    </style>
</head>
<body>
    <div class='voidmemo'>
        <div class='voidmemo-card'>
            <h1>404</h1>
            <p>这份简报没送到——页面不存在或已撤稿。</p>
            <a class='voidmemo-back' href='index.html'>回简报台</a>
        </div>
    </div>
</body>
</html>
