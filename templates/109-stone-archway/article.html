<!DOCTYPE html><html lang="[[LANG]]"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#e8ddc6"><title>穿过旧城的一道拱门 · [[SITE_NAME]]</title><meta name="description" content="一篇关于旧城拱门和院落的示例文章。"><link rel="canonical" href="https://[[SITE_DOMAIN]]/article.html"><meta property="og:type" content="article"><meta property="og:title" content="穿过旧城的一道拱门"><meta property="og:description" content="一篇关于旧城拱门和院落的示例文章。"><meta property="og:url" content="https://[[SITE_DOMAIN]]/article.html"><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="static/archway.css"></head><body><header class="archbar"><div class="archbar-in"><a class="archbar-brand" href="index.html">[[BRAND_EN]]</a><button class="archbar-btn" id="archbar-btn" type="button" aria-label="主导航" aria-expanded="false" aria-controls="archbar-nav">门径</button><nav class="archbar-nav" id="archbar-nav"><a href="index.html">门坊</a><a href="article.html" aria-current="page">入门</a><a href="tool.html">寻径</a><a href="legal.html">说明</a></nav></div></header><main class="arch-page"><nav class="arch-crumb"><a href="index.html">门坊</a><span>/</span><span>建筑</span><span>/</span><span>入门</span></nav><article class="arch-article"><header><p>ARCHWAY · 01</p><h1>穿过旧城最安静的一道拱门</h1><span>青石门洞把街声留在身后，另一侧是院落、树影和缓慢移动的午后。</span></header><div class="arch-story"><aside><span>门</span><i aria-hidden="true"></i></aside><div><section><strong>一</strong><h2>门外</h2><p>街市的声音沿石墙折返，门洞像一段短暂的阴影，把脚步从喧闹里轻轻接走。</p></section><section><strong>二</strong><h2>门中</h2><p>券石上留着细密的凿痕，潮气把颜色压深。抬头时，只能看见一条窄窄的天光。</p></section><section><strong>三</strong><h2>门内</h2><p>院子里有一株老树，午后的影子刚好停在台阶前。门外的街声已经很远。</p></section></div></div></article></main><footer class="archfoot"><div class="archfoot-in"><p>[[BRAND_EN]] · [[SITE_TAGLINE]]</p><small>本文为可替换的静态示例。</small></div></footer><script src="static/archway.js"></script></body></html>
