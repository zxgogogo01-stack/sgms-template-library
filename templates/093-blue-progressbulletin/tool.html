<!DOCTYPE html><html lang='[[LANG]]'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>状态卡｜[[SITE_NAME]]</title><meta name='description' content='生成已完成、进行中或风险项状态卡。'><link rel='canonical' href='https://[[SITE_DOMAIN]]/tool.html'><link rel='stylesheet' href='public.css'><link rel='stylesheet' href='static/progress.css'></head><body><header class='progressbar'><div class='progressbar-in'><a class='progressbar-brand' href='index.html'>[[BRAND_EN]]</a><button class='progressbar-btn' id='progressbar-btn' type='button' aria-label='主导航' aria-expanded='false' aria-controls='progressbar-nav'>●</button><nav class='progressbar-nav' id='progressbar-nav'><a href='index.html'>公报</a><a href='article.html'>进展</a><a href='tool.html' aria-current='page'>状态卡</a><a href='legal.html'>说明</a></nav></div></header><main class='progress-subpage'><nav class='progress-crumb'><a href='index.html'>公报</a> ／ 状态卡</nav><p class='progress-kicker'>Status card</p><h1 class='progress-heading'>选一个状态，补齐应该公开的信息</h1><p class='progress-lead'>进度说明既要记录已完成的事实，也要明确下一节点和可能失效的条件。</p><div class='progress-tool-grid'><div class='progress-choice-list'><button class='progress-choice is-active' type='button' data-progress='done'>已完成<span>验收、证据与维护</span></button><button class='progress-choice' type='button' data-progress='active'>进行中<span>负责人、节点与依赖</span></button><button class='progress-choice' type='button' data-progress='risk'>风险项<span>影响、条件与回退</span></button></div><section class='progress-result' aria-live='polite'><p class='progress-kicker'>Checklist</p><h2 id='progress-result-label'>已完成</h2><ol id='progress-result-list'><li><strong>01</strong><span>写清验收范围与日期</span></li><li><strong>02</strong><span>附上可复查的验证结果</span></li><li><strong>03</strong><span>说明后续维护责任</span></li></ol></section></div></main><footer class='progressfoot'><div class='progressfoot-in'><p>[[BRAND_EN]] · [[SITE_TAGLINE]]</p><nav><a href='article.html'>进展</a><a href='tool.html'>状态卡</a><a href='legal.html'>说明</a></nav><small>公报记录当前状态、已知风险和下一节点，不代表结果承诺。</small></div></footer><script src='static/progress.js'></script></body></html>
