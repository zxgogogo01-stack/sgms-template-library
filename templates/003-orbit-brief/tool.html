<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>观察窗倒计时 — {{SITE_NAME}}</title>
  <meta name="description" content="为下一次复盘设定日期，计算剩余天数与建议检查点。">
  <link rel="canonical" href="https://{{SITE_DOMAIN}}/tool.html">
  <meta property="og:title" content="观察窗倒计时 — {{SITE_NAME}}">
  <meta property="og:description" content="为下一次复盘设定日期，计算剩余天数与建议检查点。">
  <meta property="og:url" content="https://{{SITE_DOMAIN}}/tool.html">
  <link rel="stylesheet" href="assets/ground.css">
  <link rel="stylesheet" href="assets/shape.css">
  <link rel="stylesheet" href="assets/trim.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "观察窗倒计时",
    "url": "https://{{SITE_DOMAIN}}/tool.html"
  }
  </script>
</head>
<body>
  <header class="crest">
    <span class="crest__name">{{SITE_NAME}}</span>
    <span class="crest__issue">工具</span>
    <nav class="crest__links" aria-label="导航">
      <a class="crest__a" href="index.html">本期</a>
      <a class="crest__a" href="article.html">正文</a>
      <a class="crest__a" href="tool.html" aria-current="page">倒计时</a>
      <a class="crest__a" href="legal.html">说明</a>
    </nav>
  </header>

  <main class="trunk">
    <section class="issue-lead">
      <h1 class="issue-lead__title">观察窗倒计时</h1>
      <p class="issue-lead__sub">给复盘留出时间，也给中途检查留下坐标</p>
    </section>

    <form class="cd-panel" id="cd-form" novalidate>
      <p class="cd-panel__intro">选择下一次正式复盘的日期。结果只在浏览器里计算，不会保存日程。</p>
      <div class="cd-panel__row">
        <label for="cd-date">目标日期</label>
        <input type="date" id="cd-date" required>
      </div>
      <div class="cd-panel__actions"><button class="cd-panel__go" type="submit">计算窗口</button><button class="cd-panel__quick" id="cd-week" type="button">设为 7 天后</button></div>
      <div class="cd-panel__show" id="cd-out" role="status" aria-live="polite">尚未设定观察窗口。</div>
    </form>
  </main>

  <footer class="tail-bar">
    <p class="tail-bar__msg">编辑信号，不追逐噪声 · <a class="tail-bar__a" href="legal.html">方法与说明</a></p>
  </footer>

  <script src="assets/run.js"></script>
</body>
</html>
