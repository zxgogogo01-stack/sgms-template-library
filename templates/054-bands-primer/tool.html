<!DOCTYPE html>
<html lang="[[LANG]]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#33465c">
  <title>学习计划生成器 — [[SITE_NAME]]</title>
  <meta name="description" content="按课程数、可用天数和单课时长，生成可执行的入门学习节奏。">
  <link rel="canonical" href="https://[[SITE_DOMAIN]]/tool.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="[[SITE_NAME]]">
  <meta property="og:title" content="学习计划生成器 — [[SITE_NAME]]">
  <meta property="og:description" content="按课程数、可用天数和单课时长，生成可执行的入门学习节奏。">
  <meta property="og:url" content="https://[[SITE_DOMAIN]]/tool.html">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="css/tone.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "学习计划生成器",
    "url": "https://[[SITE_DOMAIN]]/tool.html"
  }
  </script>
  <style>
    /* tool page extras */
    .bp54-rigband { max-width: 560px; margin: 0 auto; padding: 46px 24px 80px; }
    .bp54-rigband-card {
      background: var(--card);
      border: 1px solid var(--edge);
      border-top: 4px solid var(--copper);
      border-radius: var(--rd);
      box-shadow: var(--sh-hi);
      padding: 40px 44px;
    }
    .bp54-rigband-card h1 { font-family: var(--serx); font-size: 1.5rem; margin-bottom: 8px; }
    .bp54-rigband-card > p { color: var(--dus); margin: 0 0 14px; }
    .bp54-rigband-card label {
      display: block;
      margin: 16px 0 6px;
      font-size: .88rem;
      font-weight: 700;
      color: var(--inkc-2);
    }
    .bp54-rigband-card input {
      width: 100%;
      min-height: 47px;
      padding: 10px 15px;
      border: 1.5px solid var(--edge);
      border-radius: 9px;
      background: var(--mist);
      color: var(--inkc);
      font: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color var(--tw), box-shadow var(--tw);
    }
    .bp54-rigband-card input:focus {
      outline: none;
      border-color: var(--slate);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--slate) 16%, transparent);
    }
    .bp54-rigband-card input[aria-invalid="true"] {
      border-color: #b42318;
      box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 18%, transparent);
    }
    .bp54-rigband-run {
      margin-top: 26px;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 9px;
      background: var(--slate);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .07em;
      cursor: pointer;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--slate-deep) 45%, transparent);
      transition: transform var(--tw), background var(--tw);
    }
    .bp54-rigband-run:hover { transform: translateY(-2px); background: var(--slate-2); }
    .bp54-rigband-run:active { transform: translateY(0); }
    .bp54-rigband-out {
      display: block;
      margin-top: 18px;
      min-height: 24px;
      padding: 14px 18px;
      border-radius: 9px;
      background: var(--copper-wash);
      color: var(--inkc-2);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 620px) {
      .bp54-rigband-card { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <a class="bp54-skip" href="#bp54-main">跳到主要内容</a>
  <header class="bp54-cap">
    <div class="bp54-cap-in">
      <a class="bp54-markrow" href="index.html">[[BRAND_EN]]</a>
      <button type="button" class="bp54-cap-btn" id="bp54-cap-btn" aria-label="主导航" aria-expanded="false" aria-controls="bp54-cap-nav">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="bp54-cap-nav" id="bp54-cap-nav" aria-label="主导航">
        <a href="index.html">入门带</a>
        <a href="article.html">读物</a>
        <a href="tool.html" aria-current="page">工具</a>
        <a href="legal.html">披露</a>
        <button type="button" class="bp54-theme" id="bp54-theme-button" aria-label="切换到夜间模式">夜间</button>
      </nav>
    </div>
  </header>

  <main class="bp54-rigband" id="bp54-main">
    <form class="bp54-rigband-card" id="bp54-plan-form" novalidate>
      <p class="bp54-plan-kicker">PACE BUILDER / INTEGER EXACT</p>
      <h1>学习计划生成器</h1>
      <p>把课程量拆成每天可完成的色带节奏。计算只在浏览器本地进行。</p>
      <label for="bp54-plan-lessons">课程数量</label>
      <input type="text" id="bp54-plan-lessons" name="lessons" inputmode="numeric" autocomplete="off" required placeholder="如 12" aria-describedby="bp54-plan-help bp54-plan-message">
      <label for="bp54-plan-days">可用天数</label>
      <input type="text" id="bp54-plan-days" name="days" inputmode="numeric" autocomplete="off" required placeholder="如 7" aria-describedby="bp54-plan-help bp54-plan-message">
      <label for="bp54-plan-minutes">每课分钟数</label>
      <input type="text" id="bp54-plan-minutes" name="minutes" inputmode="numeric" autocomplete="off" required placeholder="如 25" aria-describedby="bp54-plan-help bp54-plan-message">
      <small id="bp54-plan-help">只接受整数：课程 1–120、天数 1–365、每课 1–600 分钟。</small>
      <div class="bp54-plan-presets"><button type="button" data-plan-preset="12,7,25">一周 12 课</button><button type="button" data-plan-preset="30,14,20">两周 30 课</button><button type="button" data-plan-preset="4,10,45">宽松 4 课</button></div>
      <p class="bp54-plan-message" id="bp54-plan-message" role="alert" aria-live="polite" aria-atomic="true"></p>
      <div class="bp54-plan-actions"><button type="submit" class="bp54-rigband-run" id="bp54-plan-run">生成节奏</button><button type="button" data-plan-reset>清空</button></div>
      <section class="bp54-rigband-out bp54-plan-out" aria-live="polite" aria-atomic="true"><header><span data-plan-state>等待输入</span><button type="button" data-copy-plan disabled>复制计划</button></header><output data-plan-daily>—</output><dl><div><dt>总学习时间</dt><dd data-plan-total>—</dd></div><div><dt>高峰日用时</dt><dd data-plan-peak>—</dd></div><div><dt>实际学习日</dt><dd data-plan-active>—</dd></div><div><dt>最后一天</dt><dd data-plan-last>—</dd></div></dl><p>按每天课数向上取整；实际学习日不会超过可用天数。</p><small data-plan-copy-status role="status" aria-live="polite"></small></section>
    </form>
  </main>

  <footer class="bp54-base">
    <p class="bp54-base-line">学习计划仅用于安排阅读节奏，不构成交易或投资建议。</p>
  </footer>

  <script src="lift.js"></script>
</body>
</html>
