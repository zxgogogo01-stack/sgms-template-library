<!DOCTYPE html>
<html lang='{LANG}'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>页面不存在 — {SITE_NAME}</title>
    <meta name='robots' content='noindex'>
    <link rel='stylesheet' href='petal.css'>
    <style>
        /* 404 补充样式 */
        .wilted { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
        .wilted-card {
            background: var(--blossom);
            border-radius: 52% 48% 46% 54% / 34px 40px 36px 32px;
            box-shadow: var(--shade65-hi);
            padding: 54px 42px;
        }
        .wilted-card h1 {
            font-family: var(--serif65);
            font-size: 3.2rem;
            color: var(--moss65);
        }
        .wilted-card p { color: var(--sage65); margin: 8px 0 22px; }
    </style>
</head>
<body>
    <div class='wilted'>
        <div class='wilted-card'>
            <h1>404</h1>
            <p>这一株没种活——页面不存在或已移栽。</p>
            <a class='bud bud-full' href='index.html'>回花园</a>
        </div>
    </div>
</body>
</html>
