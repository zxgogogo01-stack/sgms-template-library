<!DOCTYPE html>
<html lang='%%LANG%%'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='theme-color' content='#f4f6f2'>
  <title>分栏容量规划器 — %%SITE_NAME%%</title>
  <meta name='description' content='按卡片总数、泳道数量与置顶数量，生成均衡的看板分栏方案。'>
  <link rel='canonical' href='https://%%SITE_DOMAIN%%/tool.html'>
  <meta property='og:type' content='website'>
  <meta property='og:site_name' content='%%SITE_NAME%%'>
  <meta property='og:title' content='分栏容量规划器 — %%SITE_NAME%%'>
  <meta property='og:description' content='按卡片总数、泳道数量与置顶数量，生成均衡的看板分栏方案。'>
  <meta property='og:url' content='https://%%SITE_DOMAIN%%/tool.html'>
  <meta name='twitter:card' content='summary'>
  <link rel='stylesheet' href='static/app.css'>
  <script type='application/ld+json'>
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "分栏容量规划器",
    "url": "https://%%SITE_DOMAIN%%/tool.html"
  }
  </script>
  <style>
    .pb56-bench { max-width: 560px; margin: 0 auto; padding: 50px 24px 84px; }
    .pb56-bench-card {
      background: var(--card6);
      border-radius: var(--arc);
      box-shadow: var(--lift-hi);
      border-top: 4px solid var(--pine);
      padding: 42px 46px;
    }
    .pb56-bench-card h1 { font-family: var(--serif6); font-size: 1.55rem; }
    .pb56-bench-card > p { color: var(--dim6); margin: 6px 0 10px; }
    .pb56-bench-card label {
      display: block;
      margin: 18px 0 6px;
      font-size: .86rem;
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--pine-deep);
    }
    .pb56-bench-card input {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border: 1.5px solid var(--hair6);
      border-radius: 11px;
      background: var(--paper6);
      color: var(--ink6);
      font: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color var(--snap), box-shadow var(--snap);
    }
    .pb56-bench-card input:focus {
      outline: none;
      border-color: var(--pine);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--pine) 16%, transparent);
    }
    .pb56-bench-card input[aria-invalid='true'] {
      border-color: #b42318;
      box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 18%, transparent);
    }
    .pb56-bench-run {
      margin-top: 28px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: var(--pine);
      color: #f2f8f4;
      font: inherit;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--pine) 34%, transparent);
      transition: transform var(--snap), background var(--snap);
    }
    .pb56-bench-run:hover { transform: translateY(-2px); background: var(--pine-deep); }
    .pb56-bench-out {
      display: block;
      margin-top: 20px;
      min-height: 26px;
      padding: 15px 19px;
      border-radius: 11px;
      background: var(--wash6);
      color: var(--ink6);
      font-variant-numeric: tabular-nums;
      line-height: 1.7;
    }
    .pb56-bench-out b { color: var(--pine-deep); }
    @media (max-width: 680px) {
      .pb56-bench-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <a class='pb56-skip' href='#pb56-main'>跳到主要内容</a>
  <header class='pb56-gable'>
    <div class='pb56-gable-in'>
      <a class='pb56-ensign' href='index.html'>%%BRAND_EN%%</a>
      <button type='button' class='pb56-gable-btn' id='pb56-gable-btn' aria-label='主导航' aria-expanded='false' aria-controls='pb56-gable-menu'>
        <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
      </button>
      <nav class='pb56-gable-menu' id='pb56-gable-menu' aria-label='主导航'>
        <a class='pb56-gable-tab' href='index.html'>看板</a>
        <a class='pb56-gable-tab' href='article.html'>文章</a>
        <a class='pb56-gable-tab' href='tool.html' aria-current='page'>容量规划</a>
        <a class='pb56-gable-tab' href='legal.html'>披露</a>
        <button type='button' class='pb56-theme' id='pb56-theme-button' aria-label='切换到夜间模式'>夜间</button>
      </nav>
    </div>
  </header>

  <main class='pb56-bench' id='pb56-main'>
    <form class='pb56-bench-card' id='pb56-capacity-form' novalidate>
      <p class='pb56-capacity-kicker'>LANE BALANCER / INTEGER EXACT</p>
      <h1>分栏容量规划器</h1>
      <p>把卡片均匀放进泳道，置顶内容不占普通泳道容量。本地计算。</p>
      <label for='pb56-capacity-total'>卡片总数</label>
      <input type='text' id='pb56-capacity-total' name='total' inputmode='numeric' autocomplete='off' required placeholder='如 19' aria-describedby='pb56-capacity-help pb56-capacity-message'>
      <label for='pb56-capacity-lanes'>泳道数量</label>
      <input type='text' id='pb56-capacity-lanes' name='lanes' inputmode='numeric' autocomplete='off' required placeholder='如 3' aria-describedby='pb56-capacity-help pb56-capacity-message'>
      <label for='pb56-capacity-featured'>置顶卡片数</label>
      <input type='text' id='pb56-capacity-featured' name='featured' inputmode='numeric' autocomplete='off' required placeholder='如 1' aria-describedby='pb56-capacity-help pb56-capacity-message'>
      <small id='pb56-capacity-help'>只接受整数：总数 1–999、泳道 1–12、置顶 0–999 且不得超过总数。</small>
      <div class='pb56-capacity-presets'><button type='button' data-capacity-preset='19,3,1'>19 卡 / 3 栏</button><button type='button' data-capacity-preset='48,4,4'>48 卡 / 4 栏</button><button type='button' data-capacity-preset='5,8,1'>少卡宽栏</button></div>
      <p class='pb56-capacity-message' id='pb56-capacity-message' role='alert' aria-live='polite' aria-atomic='true'></p>
      <div class='pb56-capacity-actions'><button type='submit' class='pb56-bench-run' id='pb56-capacity-run'>生成分栏</button><button type='button' data-capacity-reset>清空</button></div>
      <section class='pb56-bench-out pb56-capacity-out' aria-live='polite' aria-atomic='true'><header><span data-capacity-state>等待输入</span><button type='button' data-copy-capacity disabled>复制方案</button></header><output data-capacity-range>—</output><dl><div><dt>普通卡片</dt><dd data-capacity-regular>—</dd></div><div><dt>较多卡片泳道</dt><dd data-capacity-heavy>—</dd></div><div><dt>较少卡片泳道</dt><dd data-capacity-light>—</dd></div><div><dt>置顶卡片</dt><dd data-capacity-featured-result>—</dd></div></dl><ol data-capacity-list aria-label='逐泳道卡片分配'></ol><p>余数从第 1 条泳道开始依次分配，每栏最多相差 1 张。</p><small data-capacity-copy-status role='status' aria-live='polite'></small></section>
    </form>
  </main>

  <footer class='pb56-cellar'>
    <div class='pb56-cellar-in'>
      <p class='pb56-cellar-fine'>容量规划只用于内容编排，不替代事实与合规审核。</p>
    </div>
  </footer>

  <script src='static/app.js'></script>
</body>
</html>
