<!DOCTYPE html>
<html lang='%%LANG%%'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='theme-color' content='#f4f6f2'>
  <title>手续费计算器 — %%SITE_NAME%%</title>
  <meta name='description' content='输入交易金额、费率与返佣比例，算出手续费、返佣与净成本。'>
  <link rel='canonical' href='https://%%SITE_DOMAIN%%/tool.html'>
  <meta property='og:type' content='website'>
  <meta property='og:site_name' content='%%SITE_NAME%%'>
  <meta property='og:title' content='手续费计算器 — %%SITE_NAME%%'>
  <meta property='og:description' content='输入交易金额、费率与返佣比例，算出手续费、返佣与净成本。'>
  <meta property='og:url' content='https://%%SITE_DOMAIN%%/tool.html'>
  <meta name='twitter:card' content='summary'>
  <link rel='stylesheet' href='static/app.css'>
  <script type='application/ld+json'>
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "手续费计算器",
    "url": "https://%%SITE_DOMAIN%%/tool.html"
  }
  </script>
  <style>
    .bench { max-width: 560px; margin: 0 auto; padding: 50px 24px 84px; }
    .bench-card {
      background: var(--card6);
      border-radius: var(--arc);
      box-shadow: var(--lift-hi);
      border-top: 4px solid var(--pine);
      padding: 42px 46px;
    }
    .bench-card h1 { font-family: var(--serif6); font-size: 1.55rem; }
    .bench-card > p { color: var(--dim6); margin: 6px 0 10px; }
    .bench-card label {
      display: block;
      margin: 18px 0 6px;
      font-size: .86rem;
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--pine-deep);
    }
    .bench-card input {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border: 1.5px solid var(--hair6);
      border-radius: 11px;
      background: var(--paper6);
      color: var(--ink6);
      font: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color var(--snap), box-shadow var(--snap);
    }
    .bench-card input:focus {
      outline: none;
      border-color: var(--pine);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--pine) 16%, transparent);
    }
    .bench-card input[aria-invalid='true'] {
      border-color: #b42318;
      box-shadow: 0 0 0 4px color-mix(in srgb, #b42318 18%, transparent);
    }
    .bench-run {
      margin-top: 28px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: var(--pine);
      color: #f2f8f4;
      font: inherit;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--pine) 34%, transparent);
      transition: transform var(--snap), background var(--snap);
    }
    .bench-run:hover { transform: translateY(-2px); background: var(--pine-deep); }
    .bench-out {
      display: block;
      margin-top: 20px;
      min-height: 26px;
      padding: 15px 19px;
      border-radius: 11px;
      background: var(--wash6);
      color: var(--ink6);
      font-variant-numeric: tabular-nums;
      line-height: 1.7;
    }
    .bench-out b { color: var(--pine-deep); }
    @media (max-width: 680px) {
      .bench-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header class='gable'>
    <div class='gable-in'>
      <a class='ensign' href='index.html'>%%BRAND_EN%%</a>
      <button type='button' class='gable-btn' id='gable-btn' aria-label='主导航' aria-expanded='false' aria-controls='gable-menu'>
        <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
      </button>
      <nav class='gable-menu' id='gable-menu' aria-label='主导航'>
        <a class='gable-tab' href='index.html'>看板</a>
        <a class='gable-tab' href='article.html'>文章</a>
        <a class='gable-tab' href='tool.html' aria-current='page'>手续费计算</a>
        <a class='gable-tab' href='legal.html'>披露</a>
      </nav>
    </div>
  </header>

  <main class='bench'>
    <form class='bench-card' id='fee-form' novalidate>
      <h1>手续费计算器</h1>
      <p>三个数就够：交易金额、费率、返佣比例。本地计算，不上传。</p>
      <label for='fee-amt'>交易金额</label>
      <input type='number' id='fee-amt' step='any' min='0' placeholder='如 10000' aria-describedby='fee-out'>
      <label for='fee-rate'>手续费率（%）</label>
      <input type='number' id='fee-rate' step='any' min='0' max='100' placeholder='如 0.05' aria-describedby='fee-out'>
      <label for='fee-cut'>返佣比例（%，可留空）</label>
      <input type='number' id='fee-cut' step='any' min='0' max='100' placeholder='如 30' aria-describedby='fee-out'>
      <button type='submit' class='bench-run' id='fee-run'>算一算</button>
      <output class='bench-out' id='fee-out' role='status' aria-live='polite'></output>
    </form>
  </main>

  <footer class='cellar'>
    <div class='cellar-in'>
      <p class='cellar-fine'>结果仅供参考，实际以平台结算为准。</p>
    </div>
  </footer>

  <script src='static/app.js'></script>
</body>
</html>
