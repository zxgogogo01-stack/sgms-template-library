<!DOCTYPE html>
<html lang='~LANG~'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='theme-color' content='#f6f1e3'>
  <title>年成本估算器 — ~SITE_NAME~</title>
  <meta name='description' content='按月交易量、费率与返佣比例，折算全年手续费与返佣。'>
  <link rel='canonical' href='https://~SITE_DOMAIN~/tool.html'>
  <meta property='og:type' content='website'>
  <meta property='og:site_name' content='~SITE_NAME~'>
  <meta property='og:title' content='年成本估算器 — ~SITE_NAME~'>
  <meta property='og:description' content='按月交易量、费率与返佣比例，折算全年手续费与返佣。'>
  <meta property='og:url' content='https://~SITE_DOMAIN~/tool.html'>
  <meta name='twitter:card' content='summary'>
  <link rel='stylesheet' href='assets/deckset.css'>
  <script type='application/ld+json'>
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "年成本估算器",
    "url": "https://~SITE_DOMAIN~/tool.html"
  }
  </script>
  <style>
    /* tool extras */
    .till { max-width: 540px; margin: 0 auto; padding: 50px 24px 84px; }
    .till-card {
      background: var(--vellum2);
      border-radius: var(--bow);
      box-shadow: var(--murk-hi);
      border-top: 4px solid var(--straw2);
      padding: 42px 46px;
    }
    .till-card h1 { font-family: var(--serif62); font-size: 1.5rem; }
    .till-card > p { color: var(--faint2); margin: 6px 0 8px; }
    .till-card label {
      display: block;
      margin: 16px 0 6px;
      font-size: .86rem;
      font-weight: 800;
      color: var(--bark2);
    }
    .till-card input {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border: 1.5px solid var(--thread2);
      border-radius: 11px;
      background: var(--strawbed);
      color: var(--umber2);
      font: inherit;
      font-family: var(--mono62);
      font-variant-numeric: tabular-nums;
      transition: border-color var(--clip), box-shadow var(--clip);
    }
    .till-card input:focus {
      outline: none;
      border-color: var(--straw2);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--straw2) 18%, transparent);
    }
    .till-card input[aria-invalid='true'] {
      border-color: #b64c37;
      box-shadow: 0 0 0 4px color-mix(in srgb, #b64c37 16%, transparent);
    }
    .till-run {
      margin-top: 26px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: var(--bark2);
      color: var(--vellum2);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--bark2) 36%, transparent);
      transition: transform var(--clip), background var(--clip);
    }
    .till-run:hover { transform: translateY(-2px); background: var(--umber2); }
    .till-out {
      display: block;
      margin-top: 18px;
      min-height: 26px;
      padding: 15px 19px;
      border-radius: 11px;
      background: var(--haze2);
      line-height: 1.75;
      font-variant-numeric: tabular-nums;
    }
    .till-out b { color: var(--straw2-deep); }
    @media (max-width: 600px) {
      .till-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header class='visor'>
    <div class='visor-in'>
      <a class='visor-brand' href='index.html'>~BRAND_EN~</a>
      <button type='button' class='visor-btn' id='visor-btn' aria-label='主导航' aria-expanded='false' aria-controls='visor-nav'>
        <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
      </button>
      <nav class='visor-nav' id='visor-nav' aria-label='主导航'>
        <a href='index.html'>卡组</a>
        <a href='article.html'>文章</a>
        <a href='tool.html' aria-current='page'>年费估算</a>
        <a href='legal.html'>披露</a>
      </nav>
    </div>
  </header>

  <main class='till'>
    <form class='till-card' id='yc-form' novalidate>
      <h1>年成本估算器</h1>
      <p>月交易量、费率、返佣比例，折算全年三笔账。本地计算，不上传。</p>
      <label for='yc-vol'>月交易量</label>
      <input type='number' id='yc-vol' step='any' min='0' placeholder='如 100000' aria-describedby='yc-out'>
      <label for='yc-rate'>手续费率（%）</label>
      <input type='number' id='yc-rate' step='any' min='0' max='100' placeholder='如 0.05' aria-describedby='yc-out'>
      <label for='yc-cut'>返佣比例（%，可留空）</label>
      <input type='number' id='yc-cut' step='any' min='0' max='100' placeholder='如 30' aria-describedby='yc-out'>
      <button type='submit' class='till-run' id='yc-run'>折算全年</button>
      <output class='till-out' id='yc-out' role='status' aria-live='polite'></output>
    </form>
  </main>

  <footer class='stern'>
    <div class='stern-in'>
      <p class='stern-fine'>结果仅供参考，实际以平台结算为准。</p>
    </div>
  </footer>

  <script src='assets/deckset.js'></script>
</body>
</html>
