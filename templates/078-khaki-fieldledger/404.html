<!DOCTYPE html>
<html lang="__lang__">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坐标缺失 — __site_name__</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/field.css">
  <style>
    /* 404 extras */
    .lostmark { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }
    .lostmark-card {
      background: var(--canvas78);
      border: 2px solid var(--sootbrown);
      box-shadow: var(--cast78-hi);
      padding: 50px 40px;
    }
    .lostmark-card h1 {
      font-family: var(--mono78);
      font-size: 3.1rem;
      letter-spacing: .12em;
      color: var(--signalred);
      font-variant-numeric: tabular-nums;
    }
    .lostmark-card p { color: var(--drygrass); margin: 8px 0 22px; }
    .lostmark-back {
      display: inline-block;
      min-height: 46px;
      line-height: 42px;
      padding: 0 26px;
      border: 2px solid var(--olive78);
      background: var(--olive78);
      color: var(--canvas78);
      font-weight: 800;
      letter-spacing: .1em;
      transition: background var(--stride), transform var(--stride);
    }
    .lostmark-back:hover { transform: translateY(-2px); background: var(--olive78-deep); }
  </style>
</head>
<body>
  <div class="lostmark">
    <div class="lostmark-card">
      <h1>404</h1>
      <p>这一页不在勘测范围里——坐标不存在或已迁移。</p>
      <a class="lostmark-back" href="index.html">回台账</a>
    </div>
  </div>
</body>
</html>
