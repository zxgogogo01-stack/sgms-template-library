<!DOCTYPE html>
<html lang="[[LANG]]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空场 — [[SITE_NAME]]</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="static/stage.css">
  <style>
    .darkhouse { max-width: 480px; margin: 14vh auto; padding: 0 26px; text-align: center; }
    .darkhouse-card {
      background: var(--boxwhite);
      border: 1.5px solid var(--cordline);
      border-top: 5px solid var(--champgold);
      border-radius: 0 0 var(--arch84) var(--arch84);
      box-shadow: var(--limelight-hi);
      padding: 52px 40px;
    }
    .darkhouse-card h1 {
      font-family: var(--serif84);
      font-size: 3.4rem;
      color: var(--inknavy);
      font-variant-numeric: tabular-nums;
    }
    .darkhouse-card h1::after {
      content: "";
      display: block;
      width: 40px;
      height: 3px;
      background: var(--champgold);
      margin: 12px auto 0;
    }
    .darkhouse-card p { color: var(--graphite84); margin: 12px 0 24px; }
    .darkhouse-back {
      display: inline-block;
      min-height: 48px;
      line-height: 48px;
      padding: 0 28px;
      border-radius: 999px;
      background: var(--inknavy);
      color: var(--housecream);
      font-weight: 800;
      letter-spacing: .08em;
      transition: transform var(--cue84), background var(--cue84);
    }
    .darkhouse-back:hover { transform: translateY(-2px); background: var(--inknavy-2); }
  </style>
</head>
<body>
  <div class="darkhouse">
    <div class="darkhouse-card">
      <h1>404</h1>
      <p>今晚这个位置空场——页面不存在或已撤演。</p>
      <a class="darkhouse-back" href="index.html">回舞台</a>
    </div>
  </div>
</body>
</html>
