<!DOCTYPE html>
<html lang='%%LANG%%'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='theme-color' content='#0d1220'>
    <title>返佣目标进度计算器 — %%SITE_NAME%%</title>
    <meta name='description' content='输入目标金额、已返金额与月均返佣，估算完成进度与达成时间。'>
    <link rel='canonical' href='https://%%SITE_DOMAIN%%/tool.html'>
    <meta property='og:type' content='website'>
    <meta property='og:site_name' content='%%SITE_NAME%%'>
    <meta property='og:title' content='返佣目标进度计算器 — %%SITE_NAME%%'>
    <meta property='og:description' content='输入目标金额、已返金额与月均返佣，估算完成进度与达成时间。'>
    <meta property='og:url' content='https://%%SITE_DOMAIN%%/tool.html'>
    <meta name='twitter:card' content='summary'>
    <link rel='stylesheet' href='style.css'>
    <script type='application/ld+json'>
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "返佣目标进度计算器",
        "url": "https://%%SITE_DOMAIN%%/tool.html"
    }
    </script>
    <style>
        /* 工具页补充样式 */
        .console61 { max-width: 560px; margin: 0 auto; padding: 50px 26px 84px; }
        .console61-card {
            position: relative;
            background: var(--hull);
            border: 1px solid var(--weld);
            border-radius: var(--domeL);
            padding: 42px 46px;
            overflow: hidden;
        }
        .console61-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, var(--signal), transparent 70%);
        }
        .console61-card h1 { font-family: var(--serifL); font-size: 1.5rem; }
        .console61-card > p { color: var(--dust); margin: 6px 0 8px; }
        .console61-card label {
            display: block;
            margin: 16px 0 6px;
            font-family: var(--monoL);
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .12em;
            color: var(--dust);
        }
        .console61-card input {
            width: 100%;
            min-height: 48px;
            padding: 10px 16px;
            border: 1px solid var(--weld);
            border-radius: 10px;
            background: var(--deepsky);
            color: var(--starlight);
            font: inherit;
            font-family: var(--monoL);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--hoverL), box-shadow var(--hoverL);
        }
        .console61-card input:focus {
            outline: none;
            border-color: var(--signal);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--signal) 18%, transparent);
        }
        .console61-card input[aria-invalid='true'] {
            border-color: #ff776b;
            box-shadow: 0 0 0 4px color-mix(in srgb, #ff776b 18%, transparent);
        }
        .console61-run {
            margin-top: 26px;
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 10px;
            background: var(--signal);
            color: #1c0e06;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .08em;
            cursor: pointer;
            box-shadow: 0 10px 26px color-mix(in srgb, var(--signal) 40%, transparent);
            transition: transform var(--hoverL), background var(--hoverL);
        }
        .console61-run:hover { transform: translateY(-2px); background: var(--signal-hot); }
        .console61-out {
            display: block;
            margin-top: 18px;
            min-height: 26px;
            padding: 15px 19px;
            border-radius: 10px;
            background: var(--hull-2);
            line-height: 1.8;
            font-variant-numeric: tabular-nums;
        }
        .console61-out b { color: var(--signal-hot); }
        @media (max-width: 620px) {
            .console61-card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <header class='gantry'>
        <div class='gantry-in'>
            <a class='gantry-sign' href='index.html'>%%BRAND_EN%%</a>
            <button type='button' class='gantry-btn' id='gantry-btn' aria-label='主导航' aria-expanded='false' aria-controls='gantry-menu'>
                <svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
            </button>
            <nav class='gantry-menu' id='gantry-menu' aria-label='主导航'>
                <a href='index.html'>发射台</a>
                <a href='article.html'>简报</a>
                <a href='tool.html' aria-current='page'>进度计算</a>
                <a href='legal.html'>披露</a>
            </nav>
        </div>
    </header>

    <main class='console61'>
        <form class='console61-card' id='gp-form' novalidate>
            <h1>返佣目标进度计算器</h1>
            <p>设个目标，看看飞到哪了。本地计算，不上传。</p>
            <label for='gp-goal'>目标返佣金额</label>
            <input type='number' id='gp-goal' step='any' min='0' placeholder='如 1000' aria-describedby='gp-out'>
            <label for='gp-done'>已返金额</label>
            <input type='number' id='gp-done' step='any' min='0' placeholder='如 620' aria-describedby='gp-out'>
            <label for='gp-month'>月均返佣（可留空）</label>
            <input type='number' id='gp-month' step='any' min='0' placeholder='如 90' aria-describedby='gp-out'>
            <button type='submit' class='console61-run' id='gp-run'>点火计算</button>
            <output class='console61-out' id='gp-out' role='status' aria-live='polite'></output>
        </form>
    </main>

    <footer class='tarmac'>
        <div class='lane'>
            <p class='tarmac-fine'>结果仅供参考，实际以平台结算为准。</p>
        </div>
    </footer>

    <script src='ignite.js'></script>
</body>
</html>
