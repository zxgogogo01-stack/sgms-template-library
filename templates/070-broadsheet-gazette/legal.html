    .noticesheet { max-width: 680px; margin: 0 auto; padding: 44px 24px 80px; }
    .noticesheet h1 {
      font-size: 1.9rem;
      font-weight: 900;
      text-align: center;
      border-top: 4px solid var(--inkblack);
      border-bottom: 1px solid var(--inkblack);

    }
    .noticesheet-meta { text-align: center; margin: 10px 0 26px; font-family: var(--sans70); font-size: .82rem; color: var(--inkfaded); }
    .decree {
      background: var(--pagewhite);
      border: 1px solid var(--foldline);
      border-left: 4px solid var(--inkblack);
      padding: 20px 26px;
      margin-bottom: 13px;
    }
    .decree h2 {
      font-family: var(--sans70);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .2em;

<body>

    <section class='decree'>

      <p>纠错请附条目与依据：{CONTACT_EMAIL}。查实即更正并注明时间。</p>
    </section>
  </main>

  <footer class='printfoot' style='max-width: 680px; margin: 0 auto; padding: 0 24px 40px;'>
    <p class='printfoot-fine'>内容以各平台官方页面为准；不构成投资建议。</p>
  </footer>
