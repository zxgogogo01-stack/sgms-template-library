<!DOCTYPE html><html lang="[[LANG]]"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#a52e31"><title>一院清风 · [[SITE_NAME]]</title><meta name="description" content="一篇关于门楣、木柱与院落清风的示例堂记。"><link rel="canonical" href="https://[[SITE_DOMAIN]]/article.html"><meta property="og:type" content="article"><meta property="og:title" content="一院清风"><meta property="og:description" content="一篇关于门楣、木柱与院落清风的示例堂记。"><meta property="og:url" content="https://[[SITE_DOMAIN]]/article.html"><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="static/couplet.css"></head><body><header class="cplbar"><div class="cplbar-in"><a class="cplbar-brand" href="index.html">[[BRAND_EN]]</a><button class="cplbar-btn" id="cplbar-btn" type="button" aria-label="主导航" aria-expanded="false" aria-controls="cplbar-nav">堂目</button><nav class="cplbar-nav" id="cplbar-nav"><a href="index.html">横批</a><a href="article.html" aria-current="page">堂记</a><a href="tool.html">择联</a><a href="legal.html">落款</a></nav></div></header><main class="couplet-page"><nav class="couplet-crumb"><a href="index.html">横批</a><span>/</span><span>堂记</span></nav><article class="couplet-article"><header><p>HALL NOTE · 01</p><h1>一院清风从门楣下经过</h1><span>晨光照上木柱，檐下的旧匾额把一整座院子的安静留在中央。</span></header><div class="couplet-text"><aside><b>上联</b><span>檐收远岫千重雨</span></aside><div><section><strong>一</strong><h2>门楣</h2><p>匾额挂得很高，金漆已经暗了。太阳越过院墙时，仍会在最后一笔上停一会儿。</p></section><section><strong>二</strong><h2>木柱</h2><p>柱脚留着雨水和扫帚反复经过的痕迹，手掌摸上去，木纹温润而安静。</p></section><section><strong>三</strong><h2>清风</h2><p>风从敞开的门穿堂而过，竹叶、帘影和茶香都在同一刻轻轻动了一下。</p></section></div><aside><b>下联</b><span>门迎清风一院春</span></aside></div></article></main><footer class="cplfoot"><div class="cplfoot-in"><p>[[BRAND_EN]] · [[SITE_TAGLINE]]</p><small>本文与楹联为可替换的静态示例。</small></div></footer><script src="static/couplet.js"></script></body></html>
