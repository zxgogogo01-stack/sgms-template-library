        .darksea { max-width: 460px; margin: 15vh auto; padding: 0 24px; text-align: center; }

            border: 1px solid var(--riggingline);
            border-radius: calc(var(--hatch79) + 4px);
            padding: 50px 40px;
        }
        .darksea-card h1 {
            font-family: var(--serif79);

            font-variant-numeric: tabular-nums;
        }
        .darksea-card p { color: var(--mistblue); margin: 8px 0 22px; }
    </style>
