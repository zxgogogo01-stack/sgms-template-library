<!DOCTYPE html>
<html lang="[[LANG]]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0f4f8">
    <title>小单成本估算器 — [[SITE_NAME]]</title>
    <meta name="description" content="日均笔数、单笔均额、费率与返佣，估高频小单的真实成本。">
    <link rel="canonical" href="https://[[SITE_DOMAIN]]/tool.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="[[SITE_NAME]]">
    <meta property="og:title" content="小单成本估算器 — [[SITE_NAME]]">
    <meta property="og:description" content="日均笔数、单笔均额、费率与返佣，估高频小单的真实成本。">
    <meta property="og:url" content="https://[[SITE_DOMAIN]]/tool.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="static/feed.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "小单成本估算器",
        "url": "https://[[SITE_DOMAIN]]/tool.html"
    }
    </script>
    <style>
        /* 工具页补充样式 */
        .droplab { max-width: 540px; margin: 0 auto; padding: 46px 24px 80px; }
        .droplab-card {
            background: var(--foam69);
            border-radius: var(--pebble69);
            box-shadow: var(--mist69-hi);
            border-top: 4px solid var(--azure);
            padding: 40px 44px;
        }
        .droplab-card h1 { font-family: var(--serif69); font-size: 1.48rem; }
        .droplab-card > p { color: var(--greyblue); margin: 6px 0 8px; }
        .droplab-card label {
            display: block;
            margin: 16px 0 6px;
            font-size: .86rem;
            font-weight: 800;
            color: var(--azure-deep);
        }
        .droplab-card input {
            width: 100%;
            min-height: 47px;
            padding: 10px 15px;
            border: 1.5px solid var(--seafoam);
            border-radius: 11px;
            background: var(--skywash);
            color: var(--deepink);
            font: inherit;
            font-variant-numeric: tabular-nums;
            transition: border-color var(--ripple), box-shadow var(--ripple);
        }
        .droplab-card input:focus {
            outline: none;
            border-color: var(--azure);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--azure) 15%, transparent);
        }
        .droplab-card input[aria-invalid="true"] {
            border-color: #ba493a;
            box-shadow: 0 0 0 4px color-mix(in srgb, #ba493a 16%, transparent);
        }
        .droplab-run {
            margin-top: 26px;
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 999px;
            background: var(--azure);
            color: #f2f8fe;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: .05em;
            cursor: pointer;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--azure) 34%, transparent);
            transition: transform var(--ripple), background var(--ripple);
        }
        .droplab-run:hover { transform: translateY(-2px); background: var(--azure-deep); }
        .droplab-out {
            display: block;
            margin-top: 18px;
            min-height: 26px;
            padding: 15px 19px;
            border-radius: 11px;
            background: var(--shallow);
            line-height: 1.78;
            font-variant-numeric: tabular-nums;
        }
        .droplab-out b { color: var(--azure-deep); }
        @media (max-width: 600px) {
            .droplab-card { padding: 26px 20px; }
        }
    </style>
</head>
<body>
    <header class="skybar">
        <div class="skybar-in">
            <a class="skybar-brand" href="index.html">[[BRAND_EN]]</a>
            <button type="button" class="skybar-btn" id="skybar-btn" aria-label="主导航" aria-expanded="false" aria-controls="skybar-nav">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <nav class="skybar-nav" id="skybar-nav" aria-label="主导航">
                <a href="index.html">动态流</a>
                <a href="article.html">文章</a>
                <a href="tool.html" aria-current="page">小单成本</a>
                <a href="legal.html">披露</a>
            </nav>
        </div>
    </header>

    <main class="droplab">
        <form class="droplab-card" id="mi-form" novalidate>
            <h1>小单成本估算器</h1>
            <p>高频小单最容易低估手续费。四个数看清真实成本。本地计算。</p>
            <label for="mi-count">日均笔数</label>
            <input type="number" id="mi-count" step="1" min="1" placeholder="如 12" aria-describedby="mi-out">
            <label for="mi-avg">单笔均额</label>
            <input type="number" id="mi-avg" step="any" min="0" placeholder="如 300" aria-describedby="mi-out">
            <label for="mi-rate">手续费率（%）</label>
            <input type="number" id="mi-rate" step="any" min="0" max="100" placeholder="如 0.1" aria-describedby="mi-out">
            <label for="mi-cut">返佣比例（%，可留空）</label>
            <input type="number" id="mi-cut" step="any" min="0" max="100" placeholder="如 30" aria-describedby="mi-out">
            <button type="submit" class="droplab-run" id="mi-run">估一估</button>
            <output class="droplab-out" id="mi-out" role="status" aria-live="polite"></output>
        </form>
    </main>

    <footer class="seabed">
        <div class="seabed-in">
            <p class="seabed-fine">结果仅供参考，实际以平台结算为准。</p>
        </div>
    </footer>

    <script src="static/feed.js"></script>
</body>
</html>
